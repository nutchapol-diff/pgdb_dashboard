rrival is a separate event"], ["RIS_ORDERDTL", "PRIORITY", "Group by source priority code; hospital time targets need confirmation"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["mart.exam_timing"], "formula": "Group by trimmed raw priority code, missing/blank = Unknown. Compute percentile_cont(.5)/60 and percentile_cont(.9)/60 on valid total minutes; also active, valid and missing-report counts.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_EXAMRESULT", "body": "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "stage": 0, "level": 0}, {"id": "s4", "title": "RIS_ORDERDTL", "body": "IMAGE_CAPTURED_ON", "stage": 0, "level": 0}, {"id": "s5", "title": "RIS_ORDERDTL", "body": "PRIORITY", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON\nimage_captured_at ← RIS_ORDERDTL.IMAGE_CAPTURED_ON\npriority_code ← RIS_ORDERDTL.PRIORITY\nis_deleted: Y → true; N → false", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "timing", "title": "mart.exam_timing", "body": "VIEW · calculated when queried\nreport_at = COALESCE(first_finalized_at, finalized_at)\norder_to_capture_min = seconds(image_captured_at − ordered_at) / 60\ncapture_to_report_min = seconds(report_at − image_captured_at) / 60\norder_to_report_min = seconds(report_at − ordered_at) / 60\nEach missing/negative interval → NULL\nOnly is_deleted = false", "stage": 2, "level": 2}, {"id": "widget", "title": "Process Time priority comparison", "body": "priority_code = trimmed priority_code, blank/missing → Unknown\np50_hours = percentile(order_to_report_min, 50%) / 60\np90_hours = percentile(order_to_report_min, 90%) / 60\nactive_exams = COUNT(exam rows)\nvalid_samples = COUNT(order_to_report_min)\nmissing_report = COUNT(report_at IS NULL)\nGroup by priority_code", "stage": 3, "level": 3}], "edges": [["s0", "fact"], ["s1", "fact"], ["s3", "fact"], ["s4", "fact"], ["s5", "fact"], ["s2", "modality"], ["fact", "timing"], ["timing", "widget"], ["modality", "widget"]]}, "note": "No guessed priority meanings or SLA. Small samples may be unstable. Missing reports excluded from percentiles, retained in coverage counts. Selected type/dates and active exam rules apply.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "One exam journey, three measured phases", "headers": ["Exam", "Order time", "Capture time", "First finalized report time"], "before": [["Demo A", "09:00", "09:05", "09:10"], ["Demo B", "09:00", "09:05", "09:20"], ["Demo C", "09:00", "09:05", "09:30"], ["Demo D", "09:00", "09:05", "09:40"], ["Demo E", "09:00", "09:05", "14:00"]], "after": [["Mean order → capture", "5 min", "All five share this phase"], ["Mean capture → report", "75 min", "5, 15, 25, 35, 295 min"], ["Mean order → report", "80 min", "5 + 75 on the same complete cohort"]], "answer": "Using the same five exams with all required times, phase means add to total mean. Total p50 = 30 min; p90 = 196 min using continuous interpolation. Four of five totals are ≤4 hours (80%); one is >4–24 hours (20%). Phase percentiles must not be added.", "bars": [["Mean order → capture", 5], ["Mean capture → report", 75], ["Mean order → report", 80]], "unit": "min"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/process_time_priority.sql", "code": "-- Keep raw codes; no inferred priority meanings or SLA. Include missing-report coverage.\nSELECT COALESCE(NULLIF(btrim(f.priority_code), ''), 'Unknown') AS priority_code,\n       count(*)::bigint AS active_exams,\n       count(f.order_to_report_min)::bigint AS valid_samples,\n       count(*) FILTER (WHERE f.report_at IS NULL)::bigint AS missing_report,\n       percentile_cont(0.5) WITHIN GROUP (ORDER BY f.order_to_report_min) / 60 AS p50_hours,\n       percentile_cont(0.9) WITHIN GROUP (ORDER BY f.order_to_report_min) / 60 AS p90_hours\nFROM mart.exam_timing f\nWHERE {where}\nGROUP BY 1 ORDER BY 1;\n"}]}, {"label": "Mean TAT: Normal vs IQR Outliers", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_EXAMRESULT", "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "Report time: use first finalization when present, otherwise finalization"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["dw.dim_modality", "dw.fact_exam"], "formula": "TAT minutes = (COALESCE(first_finalized_at, finalized_at) − ordered_at) in seconds / 60. Low: TAT \u003c Q1 − 1.5 × IQR. High: TAT > Q3 + 1.5 × IQR. Daily quartiles use all selected valid intervals. Normal: lower fence ≤ TAT ≤ upper fence. For each day and group, mean = SUM(TAT minutes in that group) / COUNT(exams in that group). SQL averages the actual exam durations, not daily means or IQR boundaries.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_EXAMRESULT", "body": "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "widget", "title": "Mean TAT: Normal vs IQR Outliers", "body": "report_at = COALESCE(first_finalized_at, finalized_at)\ntat_min = seconds(report_at − ordered_at) / 60\nDuration statistics include only report_at ≥ ordered_at\nq1_min = percentile(tat_min, 25%) per order_date\nq3_min = percentile(tat_min, 75%) per order_date\niqr_min = q3_min − q1_min\nlower_cutoff_min = q1_min − 1.5 × iqr_min\nupper_cutoff_min = q3_min + 1.5 × iqr_min\nmean_min = SUM(tat_min) / COUNT(tat_min)\niqr_outliers = COUNT(tat_min \u003c lower_cutoff_min OR tat_min > upper_cutoff_min)\nover_four_hours = COUNT(tat_min > 240)\nlow_outlier_mean_min = AVG(tat_min where tat_min \u003c lower_cutoff_min)\nhigh_outlier_mean_min = AVG(tat_min where tat_min > upper_cutoff_min)\nnormal_mean_min = AVG(tat_min where lower_cutoff_min ≤ tat_min ≤ upper_cutoff_min)\nWhiskers = MIN / MAX(tat_min within fences)\nAll statistics grouped by order_date", "stage": 3, "level": 2}], "edges": [["s0", "fact"], ["s1", "fact"], ["s3", "fact"], ["s2", "modality"], ["fact", "widget"], ["modality", "widget"]]}, "note": "Not a four-hour count or SLA. Both tails use the same daily fences as the box plot/comparison. Missing and negative intervals are excluded; deleted/unknown flags are included. A day with no outliers has a NULL mean and no bar. No patient identifiers are returned.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "Start and end times → elapsed minutes → daily summary", "headers": ["Exam", "Order time", "Report time used"], "before": [["Demo A", "09:00", "09:10"], ["Demo B", "09:00", "09:20"], ["Demo C", "09:00", "09:30"], ["Demo D", "09:00", "09:40"], ["Demo E", "09:00", "14:00"], ["Demo F", "09:00", "Missing"]], "after": [["Durations included in the calculation", "10, 20, 30, 40, 300 min", "Missing report excluded from timing"], ["Mean / median", "80 min / 30 min", "400 / 5 versus middle value"], [">4h / IQR outliers", "1 / 1 exam", "Q1=20, Q3=40; upper fence=70 min"]], "answer": "Six exam records, but five calculable durations. Median = 30 min; mean = 80 min. Normal IQR group mean = 25 min; high-outlier mean = 300 min. These illustrate timing math; phase and deletion rules depend on the selected widget.", "bars": [["Mean", 80], ["Median", 30], ["High-outlier mean", 300]], "unit": "min"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/tat_box_daily.sql", "code": "-- Same population as daily.sql: all deletion flags, valid order-to-first-final\n-- intervals, selected order dates/modality. Compute exact quartiles in PostgreSQL.\n-- Summarize both outlier tails using the same daily fences; absent means are NULL.\nWITH durations AS (\n    SELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n           EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at,f.finalized_at)\n                              - f.ordered_at)) / 60 AS tat_min\n    FROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\n    WHERE {where}\n      AND COALESCE(f.first_finalized_at,f.finalized_at) >= f.ordered_at\n), quartiles AS (\n    SELECT order_date, count(*)::bigint AS valid_samples,\n           percentile_cont(ARRAY[0.25,0.5,0.75]) WITHIN GROUP (ORDER BY tat_min) AS q\n    FROM durations GROUP BY order_date\n), fences AS (\n    SELECT *, q[1] - 1.5 * (q[3]-q[1]) AS lower_cutoff_min,\n              q[3] + 1.5 * (q[3]-q[1]) AS upper_cutoff_min\n    FROM quartiles\n)\nSELECT s.order_date, s.valid_samples,\n       avg(d.tat_min) AS mean_min,\n       s.q[1] AS q1_min, s.q[2] AS median_min, s.q[3] AS q3_min,\n       s.q[3]-s.q[1] AS iqr_min, s.lower_cutoff_min, s.upper_cutoff_min,\n       min(d.tat_min) FILTER (WHERE d.tat_min BETWEEN s.lower_cutoff_min AND s.upper_cutoff_min) AS lower_whisker_min,\n       max(d.tat_min) FILTER (WHERE d.tat_min BETWEEN s.lower_cutoff_min AND s.upper_cutoff_min) AS upper_whisker_min,\n       count(*) FILTER (WHERE d.tat_min \u003c s.lower_cutoff_min OR d.tat_min > s.upper_cutoff_min)::bigint AS iqr_outliers,\n       avg(d.tat_min) FILTER (WHERE d.tat_min \u003c s.lower_cutoff_min) AS low_outlier_mean_min,\n       avg(d.tat_min) FILTER (WHERE d.tat_min > s.upper_cutoff_min) AS high_outlier_mean_min,\n       avg(d.tat_min) FILTER (WHERE d.tat_min BETWEEN s.lower_cutoff_min AND s.upper_cutoff_min) AS normal_mean_min,\n       count(*) FILTER (WHERE d.tat_min BETWEEN s.lower_cutoff_min AND s.upper_cutoff_min)::bigint AS normal_count,\n       count(*) FILTER (WHERE d.tat_min \u003c s.lower_cutoff_min)::bigint AS low_outlier_count,\n       count(*) FILTER (WHERE d.tat_min > s.upper_cutoff_min)::bigint AS high_outlier_count,\n       count(*) FILTER (WHERE d.tat_min > 240)::bigint AS over_four_hours\nFROM fences s JOIN durations d USING (order_date)\nGROUP BY s.order_date, s.valid_samples, s.q, s.lower_cutoff_min, s.upper_cutoff_min\nORDER BY s.order_date;\n"}]}, {"label": "Daily TAT comparison / box plot / IQR outliers / Exams over 4 hours", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_EXAMRESULT", "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "Report time: use first finalization when present, otherwise finalization"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["dw.dim_modality", "dw.fact_exam"], "formula": "Mean TAT = SUM(valid durations) / COUNT(valid durations). Counts use the left chart axis; mean minutes use the right axis. IQR = Q3 − Q1. Statistical fences = Q1 − 1.5 × IQR and Q3 + 1.5 × IQR. Whiskers are observed values inside fences. Fixed threshold count = valid TAT > 240 minutes.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_EXAMRESULT", "body": "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "widget", "title": "Daily TAT comparison / box plot / IQR outliers / Exams over 4 hours", "body": "report_at = COALESCE(first_finalized_at, finalized_at)\ntat_min = seconds(report_at − ordered_at) / 60\nDuration statistics include only report_at ≥ ordered_at\nq1_min = percentile(tat_min, 25%) per order_date\nq3_min = percentile(tat_min, 75%) per order_date\niqr_min = q3_min − q1_min\nlower_cutoff_min = q1_min − 1.5 × iqr_min\nupper_cutoff_min = q3_min + 1.5 × iqr_min\nmean_min = SUM(tat_min) / COUNT(tat_min)\niqr_outliers = COUNT(tat_min \u003c lower_cutoff_min OR tat_min > upper_cutoff_min)\nover_four_hours = COUNT(tat_min > 240)\nlow_outlier_mean_min = AVG(tat_min where tat_min \u003c lower_cutoff_min)\nhigh_outlier_mean_min = AVG(tat_min where tat_min > upper_cutoff_min)\nnormal_mean_min = AVG(tat_min where lower_cutoff_min ≤ tat_min ≤ upper_cutoff_min)\nWhiskers = MIN / MAX(tat_min within fences)\nAll statistics grouped by order_date", "stage": 3, "level": 2}], "edges": [["s0", "fact"], ["s1", "fact"], ["s3", "fact"], ["s2", "modality"], ["fact", "widget"], ["modality", "widget"]]}, "note": "Exact daily percentile_cont quartiles for valid order-to-first-final intervals. Includes deleted/unknown flags, matching daily median. Statistical outliers and the 4h prototype threshold have different meanings; neither is a confirmed SLA.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "Start and end times → elapsed minutes → daily summary", "headers": ["Exam", "Order time", "Report time used"], "before": [["Demo A", "09:00", "09:10"], ["Demo B", "09:00", "09:20"], ["Demo C", "09:00", "09:30"], ["Demo D", "09:00", "09:40"], ["Demo E", "09:00", "14:00"], ["Demo F", "09:00", "Missing"]], "after": [["Durations included in the calculation", "10, 20, 30, 40, 300 min", "Missing report excluded from timing"], ["Mean / median", "80 min / 30 min", "400 / 5 versus middle value"], [">4h / IQR outliers", "1 / 1 exam", "Q1=20, Q3=40; upper fence=70 min"]], "answer": "Six exam records, but five calculable durations. Median = 30 min; mean = 80 min. Normal IQR group mean = 25 min; high-outlier mean = 300 min. These illustrate timing math; phase and deletion rules depend on the selected widget.", "bars": [["Mean", 80], ["Median", 30], ["High-outlier mean", 300]], "unit": "min"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/tat_box_daily.sql", "code": "-- Same population as daily.sql: all deletion flags, valid order-to-first-final\n-- intervals, selected order dates/modality. Compute exact quartiles in PostgreSQL.\n-- Summarize both outlier tails using the same daily fences; absent means are NULL.\nWITH durations AS (\n    SELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n           EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at,f.finalized_at)\n                              - f.ordered_at)) / 60 AS tat_min\n    FROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\n    WHERE {where}\n      AND COALESCE(f.first_finalized_at,f.finalized_at) >= f.ordered_at\n), quartiles AS (\n    SELECT order_date, count(*)::bigint AS valid_samples,\n           percentile_cont(ARRAY[0.25,0.5,0.75]) WITHIN GROUP (ORDER BY tat_min) AS q\n    FROM durations GROUP BY order_date\n), fences AS (\n    SELECT *, q[1] - 1.5 * (q[3]-q[1]) AS lower_cutoff_min,\n              q[3] + 1.5 * (q[3]-q[1]) AS upper_cutoff_min\n    FROM quartiles\n)\nSELECT s.order_date, s.valid_samples,\n       avg(d.tat_min) AS mean_min,\n       s.q[1] AS q1_min, s.q[2] AS median_min, s.q[3] AS q3_min,\n       s.q[3]-s.q[1] AS iqr_min, s.lower_cutoff_min, s.upper_cutoff_min,\n       min(d.tat_min) FILTER (WHERE d.tat_min BETWEEN s.lower_cutoff_min AND s.upper_cutoff_min) AS lower_whisker_min,\n       max(d.tat_min) FILTER (WHERE d.tat_min BETWEEN s.lower_cutoff_min AND s.upper_cutoff_min) AS upper_whisker_min,\n       count(*) FILTER (WHERE d.tat_min \u003c s.lower_cutoff_min OR d.tat_min > s.upper_cutoff_min)::bigint AS iqr_outliers,\n       avg(d.tat_min) FILTER (WHERE d.tat_min \u003c s.lower_cutoff_min) AS low_outlier_mean_min,\n       avg(d.tat_min) FILTER (WHERE d.tat_min > s.upper_cutoff_min) AS high_outlier_mean_min,\n       avg(d.tat_min) FILTER (WHERE d.tat_min BETWEEN s.lower_cutoff_min AND s.upper_cutoff_min) AS normal_mean_min,\n       count(*) FILTER (WHERE d.tat_min BETWEEN s.lower_cutoff_min AND s.upper_cutoff_min)::bigint AS normal_count,\n       count(*) FILTER (WHERE d.tat_min \u003c s.lower_cutoff_min)::bigint AS low_outlier_count,\n       count(*) FILTER (WHERE d.tat_min > s.upper_cutoff_min)::bigint AS high_outlier_count,\n       count(*) FILTER (WHERE d.tat_min > 240)::bigint AS over_four_hours\nFROM fences s JOIN durations d USING (order_date)\nGROUP BY s.order_date, s.valid_samples, s.q, s.lower_cutoff_min, s.upper_cutoff_min\nORDER BY s.order_date;\n"}]}, {"label": "Order and exam volume (Daily / Weekly / Monthly)", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME, IS_CANCELED", "Canceled order IDs (IS_CANCELED = Y) are loaded separately and excluded from RIS Snapshot"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["dw.dim_modality", "dw.fact_exam"], "formula": "COUNT(DISTINCT order_id) and COUNT(*) within each Bangkok order-date calendar bucket. Weeks start Monday. Missing displayed buckets filled with zero matching stored records.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME, IS_CANCELED", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "canceled", "title": "mart.canceled_orders", "body": "SAVED TABLE · explicit canceled order IDs\norder_id ← RIS_ORDER.ORDER_ID where IS_CANCELED = Y\nExclude matching fact_exam.order_id\nAlso exclude fact_exam.is_deleted = true\nRaw fact rows remain stored", "stage": 2, "level": 1}, {"id": "widget", "title": "Order and exam volume (Daily / Weekly / Monthly)", "body": "period_start = date_trunc(selected day/week/month, Bangkok ordered_at)\norders = COUNT(DISTINCT order_id)\nexams = COUNT(exam rows)\nGroup by period_start; empty displayed periods filled with 0", "stage": 3, "level": 2}], "edges": [["s0", "fact"], ["s1", "fact"], ["s2", "modality"], ["s0", "canceled"], ["fact", "widget"], ["modality", "widget"], ["canceled", "widget"]]}, "note": "Selection boundary periods and first/latest source days are flagged; source completeness is unverified. RIS Snapshot excludes canceled orders and deleted exam details; unknown flags are retained. Orders are counted directly per period, not by summing daily distinct counts.", "context": "Selected ORDER dates and modality type; day/week/month calendar buckets", "example": {"title": "One order can contain multiple exams", "headers": ["Order", "Exam", "Modality"], "before": [["Demo 1", "Exam A", "CT"], ["Demo 1", "Exam B", "MRI"], ["Demo 2", "Exam C", "CT"]], "after": [["All", "2 distinct orders", "3 exam details"], ["CT", "2 exam details", "66.7% of exams"], ["MRI", "1 exam detail", "33.3% of exams"]], "answer": "Order count = 2; exam count = 3. Modality shares use exam details. Per-modality distinct-order counts can overlap.", "bars": [["CT exam records", 2], ["MRI exam records", 1]], "unit": "exams"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/volume_by_period.sql", "code": "-- First bound parameter: day, week (Monday start), or month.\n-- Count orders directly within each period; do not sum daily distinct counts.\nSELECT date_trunc(%s, f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS period_start,\n       count(DISTINCT f.order_id)::bigint AS orders,\n       count(*)::bigint AS exams\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nWHERE {where}\nGROUP BY 1 ORDER BY 1;\n"}]}, {"label": "Modality share of exam records", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME, IS_CANCELED", "Canceled order IDs (IS_CANCELED = Y) are loaded separately and excluded from RIS Snapshot"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["dw.dim_modality", "dw.fact_exam"], "formula": "100 × modality exam records / all selected exam records. Group by modality name; denominator follows the same date/modality-type filter.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME, IS_CANCELED", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "canceled", "title": "mart.canceled_orders", "body": "SAVED TABLE · explicit canceled order IDs\norder_id ← RIS_ORDER.ORDER_ID where IS_CANCELED = Y\nExclude matching fact_exam.order_id\nAlso exclude fact_exam.is_deleted = true\nRaw fact rows remain stored", "stage": 2, "level": 1}, {"id": "widget", "title": "Modality share of exam records", "body": "exam_records = COUNT(exam rows) per modality_name\nselected_exam_records = SUM(exam_records across selected modalities)\nshare_pct = 100 × exam_records / selected_exam_records", "stage": 3, "level": 2}], "edges": [["s0", "fact"], ["s1", "fact"], ["s2", "modality"], ["s0", "canceled"], ["fact", "widget"], ["modality", "widget"], ["canceled", "widget"]]}, "note": "Each exam detail contributes to one modality. One selected type may contain multiple modality devices. Includes deleted/unknown rows; unmapped rows excluded. Rounded displayed percentages may not sum to exactly 100%.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "One order can contain multiple exams", "headers": ["Order", "Exam", "Modality"], "before": [["Demo 1", "Exam A", "CT"], ["Demo 1", "Exam B", "MRI"], ["Demo 2", "Exam C", "CT"]], "after": [["All", "2 distinct orders", "3 exam details"], ["CT", "2 exam details", "66.7% of exams"], ["MRI", "1 exam detail", "33.3% of exams"]], "answer": "Order count = 2; exam count = 3. Modality shares use exam details. Per-modality distinct-order counts can overlap.", "bars": [["CT exam records", 2], ["MRI exam records", 1]], "unit": "exams"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*
