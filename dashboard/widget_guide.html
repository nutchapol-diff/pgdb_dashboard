t ten.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, ACCESSION_NO", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_EXAMRESULT", "body": "FIRSTFINALIZED_ON, FINALIZED_ON, FINALIZED_BY", "stage": 0, "level": 0}, {"id": "s3", "title": "HR_EMP", "body": "EMP_ID, IS_RADIOLOGIST, names", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON\nradiologist_id ← FINALIZED_BY matched to HR_EMP.EMP_ID (IS_RADIOLOGIST = Y)", "stage": 2, "level": 1}, {"id": "radiologist", "title": "dw.dim_radiologist", "body": "SAVED TABLE\nemployee_id ← HR_EMP.EMP_ID\ndisplay_name ← HR_EMP name columns", "stage": 2, "level": 1}, {"id": "producer", "title": "mart.producer_daily", "body": "SAVED MATERIALIZED VIEW\nreport_date = Bangkok date(COALESCE(first_finalized_at, finalized_at))\nfinalized_reports = COUNT(finalized exam rows)\nGroup by report_date + radiologist_id", "stage": 2, "level": 2}, {"id": "producer_view", "title": "mart.top_producers_daily", "body": "VIEW\nreport_date, finalized_reports ← mart.producer_daily\ndisplay_name ← dw.dim_radiologist\nJoin radiologist_id = employee_id", "stage": 2, "level": 3}, {"id": "widget", "title": "Top Producers", "body": "\"Reports\" = SUM(finalized_reports) per display_name\nFilter by report_date; sort descending; show largest 10\nNo modality filter", "stage": 3, "level": 4}], "edges": [["s0", "fact"], ["s1", "fact"], ["s2", "fact"], ["s3", "fact"], ["s3", "radiologist"], ["fact", "producer"], ["producer", "producer_view"], ["radiologist", "producer_view"], ["producer_view", "widget"]]}, "note": "Uses report dates and ignores modality. Includes deleted rows; same names can combine providers. Finalizing provider is not necessarily first-final provider.", "context": "REPORT dates, not order dates. Modality filter does not apply.", "example": {"title": "Finalized exam reports → provider totals", "headers": ["Exam", "Report date", "Finalizing provider"], "before": [["Demo A", "Day 1", "Provider A"], ["Demo B", "Day 1", "Provider A"], ["Demo C", "Day 1", "Provider B"]], "after": [["Provider A", "2 reports", "Sum of finalized exam reports"], ["Provider B", "1 report", "Rank below Provider A"]], "answer": "Group represented finalized reports by matched provider and REPORT date. Provider A has 2, Provider B has 1. This counts exam reports, not unique patients or reading effort.", "bars": [["Provider A", 2], ["Provider B", 1]], "unit": "reports"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/top_producers.sql", "code": "SELECT display_name AS \"Radiologist\", sum(finalized_reports)::bigint AS \"Reports\"\nFROM mart.top_producers_daily\nWHERE report_date BETWEEN %s AND %s\nGROUP BY display_name ORDER BY \"Reports\" DESC LIMIT 10;\n"}]}, {"label": "Process Time cards / >4h share / Timestamp coverage", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_EXAMRESULT", "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "Report time: use first finalization when present, otherwise finalization"], ["RIS_ORDERDTL", "IMAGE_CAPTURED_ON", "Time image capture was recorded; patient arrival is a separate event"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["mart.exam_timing"], "formula": "For is_deleted IS FALSE: valid phase p50/p90; >4h% = 100 × valid total intervals >240 / all valid total intervals. Coverage flag share uses active exam count.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_EXAMRESULT", "body": "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "stage": 0, "level": 0}, {"id": "s4", "title": "RIS_ORDERDTL", "body": "IMAGE_CAPTURED_ON", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON\nimage_captured_at ← RIS_ORDERDTL.IMAGE_CAPTURED_ON\npriority_code ← RIS_ORDERDTL.PRIORITY\nis_deleted: Y → true; N → false", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "timing", "title": "mart.exam_timing", "body": "VIEW · calculated when queried\nreport_at = COALESCE(first_finalized_at, finalized_at)\norder_to_capture_min = seconds(image_captured_at − ordered_at) / 60\ncapture_to_report_min = seconds(report_at − image_captured_at) / 60\norder_to_report_min = seconds(report_at − ordered_at) / 60\nEach missing/negative interval → NULL\nOnly is_deleted = false", "stage": 2, "level": 2}, {"id": "widget", "title": "Process Time cards / >4h share / Timestamp coverage", "body": "capture_p50 / capture_p90 = percentile(order_to_capture_min, 50% / 90%)\nreading_p50 / reading_p90 = percentile(capture_to_report_min, 50% / 90%)\ntotal_p50 / total_p90 = percentile(order_to_report_min, 50% / 90%)\nover_four_hours = COUNT(order_to_report_min > 240)\ntotal_samples = COUNT(order_to_report_min)\nover_four_hours_pct = 100 × over_four_hours / total_samples\nEach phase uses its own non-NULL durations", "stage": 3, "level": 3}], "edges": [["s0", "fact"], ["s1", "fact"], ["s3", "fact"], ["s4", "fact"], ["s2", "modality"], ["fact", "timing"], ["timing", "widget"], ["modality", "widget"]]}, "note": "Each phase has its own sample. Coverage flags overlap. Unknown deletion flags are excluded too. Capture timing is not patient waiting or active reading.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "One exam journey, three measured phases", "headers": ["Exam", "Order time", "Capture time", "First finalized report time"], "before": [["Demo A", "09:00", "09:05", "09:10"], ["Demo B", "09:00", "09:05", "09:20"], ["Demo C", "09:00", "09:05", "09:30"], ["Demo D", "09:00", "09:05", "09:40"], ["Demo E", "09:00", "09:05", "14:00"]], "after": [["Mean order → capture", "5 min", "All five share this phase"], ["Mean capture → report", "75 min", "5, 15, 25, 35, 295 min"], ["Mean order → report", "80 min", "5 + 75 on the same complete cohort"]], "answer": "Using the same five exams with all required times, phase means add to total mean. Total p50 = 30 min; p90 = 196 min using continuous interpolation. Four of five totals are ≤4 hours (80%); one is >4–24 hours (20%). Phase percentiles must not be added.", "bars": [["Mean order → capture", 5], ["Mean capture → report", 75], ["Mean order → report", 80]], "unit": "min"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/process_time_summary.sql", "code": "SELECT count(*)::bigint AS exams,\n       count(f.order_to_capture_min)::bigint AS capture_samples,\n       count(f.capture_to_report_min)::bigint AS report_after_capture_samples,\n       count(f.order_to_report_min)::bigint AS total_samples,\n       count(*) FILTER (WHERE f.image_captured_at IS NULL)::bigint AS missing_capture,\n       count(*) FILTER (WHERE f.report_at IS NULL)::bigint AS missing_report,\n       count(*) FILTER (WHERE f.capture_before_order)::bigint AS capture_before_order,\n       count(*) FILTER (WHERE f.report_before_capture)::bigint AS report_before_capture,\n       count(*) FILTER (WHERE f.report_before_order)::bigint AS report_before_order,\n       percentile_cont(0.5) WITHIN GROUP (ORDER BY f.order_to_capture_min) AS capture_p50,\n       percentile_cont(0.9) WITHIN GROUP (ORDER BY f.order_to_capture_min) AS capture_p90,\n       percentile_cont(0.5) WITHIN GROUP (ORDER BY f.capture_to_report_min) AS reading_p50,\n       percentile_cont(0.9) WITHIN GROUP (ORDER BY f.capture_to_report_min) AS reading_p90,\n       percentile_cont(0.5) WITHIN GROUP (ORDER BY f.order_to_report_min) AS total_p50,\n       percentile_cont(0.9) WITHIN GROUP (ORDER BY f.order_to_report_min) AS total_p90,\n       count(*) FILTER (WHERE f.order_to_report_min > 240)::bigint AS over_four_hours,\n       round(100.0 * count(*) FILTER (WHERE f.order_to_report_min > 240)\n             / nullif(count(f.order_to_report_min), 0), 1) AS over_four_hours_pct\nFROM mart.exam_timing f\nWHERE {where};\n"}]}, {"label": "Process Time daily p50/p90", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_EXAMRESULT", "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "Report time: use first finalization when present, otherwise finalization"], ["RIS_ORDERDTL", "IMAGE_CAPTURED_ON", "Time image capture was recorded; patient arrival is a separate event"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["mart.exam_timing"], "formula": "Daily p50 and p90 of valid order-to-report minutes for explicitly active rows.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_EXAMRESULT", "body": "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "stage": 0, "level": 0}, {"id": "s4", "title": "RIS_ORDERDTL", "body": "IMAGE_CAPTURED_ON", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON\nimage_captured_at ← RIS_ORDERDTL.IMAGE_CAPTURED_ON\npriority_code ← RIS_ORDERDTL.PRIORITY\nis_deleted: Y → true; N → false", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "timing", "title": "mart.exam_timing", "body": "VIEW · calculated when queried\nreport_at = COALESCE(first_finalized_at, finalized_at)\norder_to_capture_min = seconds(image_captured_at − ordered_at) / 60\ncapture_to_report_min = seconds(report_at − image_captured_at) / 60\norder_to_report_min = seconds(report_at − ordered_at) / 60\nEach missing/negative interval → NULL\nOnly is_deleted = false", "stage": 2, "level": 2}, {"id": "widget", "title": "Process Time daily p50/p90", "body": "p50_min = percentile(order_to_report_min, 50%)\np90_min = percentile(order_to_report_min, 90%)\nvalid_samples = COUNT(order_to_report_min)\nover_four_hours = COUNT(order_to_report_min > 240)\nGroup by Bangkok date(ordered_at)", "stage": 3, "level": 3}], "edges": [["s0", "fact"], ["s1", "fact"], ["s3", "fact"], ["s4", "fact"], ["s2", "modality"], ["fact", "timing"], ["timing", "widget"], ["modality", "widget"]]}, "note": "Grouped by Bangkok order date. Period median is not the average of daily medians.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "One exam journey, three measured phases", "headers": ["Exam", "Order time", "Capture time", "First finalized report time"], "before": [["Demo A", "09:00", "09:05", "09:10"], ["Demo B", "09:00", "09:05", "09:20"], ["Demo C", "09:00", "09:05", "09:30"], ["Demo D", "09:00", "09:05", "09:40"], ["Demo E", "09:00", "09:05", "14:00"]], "after": [["Mean order → capture", "5 min", "All five share this phase"], ["Mean capture → report", "75 min", "5, 15, 25, 35, 295 min"], ["Mean order → report", "80 min", "5 + 75 on the same complete cohort"]], "answer": "Using the same five exams with all required times, phase means add to total mean. Total p50 = 30 min; p90 = 196 min using continuous interpolation. Four of five totals are ≤4 hours (80%); one is >4–24 hours (20%). Phase percentiles must not be added.", "bars": [["Mean order → capture", 5], ["Mean capture → report", 75], ["Mean order → report", 80]], "unit": "min"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/process_time_daily.sql", "code": "SELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       count(*)::bigint AS exams,\n       count(f.order_to_report_min)::bigint AS valid_samples,\n       percentile_cont(0.5) WITHIN GROUP (ORDER BY f.order_to_report_min) AS p50_min,\n       percentile_cont(0.9) WITHIN GROUP (ORDER BY f.order_to_report_min) AS p90_min,\n       count(*) FILTER (WHERE f.order_to_report_min > 240)::bigint AS over_four_hours\nFROM mart.exam_timing f\nWHERE {where}\nGROUP BY 1 ORDER BY 1;\n"}]}, {"label": "Process Time by modality", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_EXAMRESULT", "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "Report time: use first finalization when present, otherwise finalization"], ["RIS_ORDERDTL", "IMAGE_CAPTURED_ON", "Time image capture was recorded; patient arrival is a separate event"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["dw.dim_modality", "mart.exam_timing"], "formula": "Active counts, valid phase counts, p50/p90 and >4h percentage by modality ID/name.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_EXAMRESULT", "body": "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "stage": 0, "level": 0}, {"id": "s4", "title": "RIS_ORDERDTL", "body": "IMAGE_CAPTURED_ON", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON\nimage_captured_at ← RIS_ORDERDTL.IMAGE_CAPTURED_ON\npriority_code ← RIS_ORDERDTL.PRIORITY\nis_deleted: Y → true; N → false", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "timing", "title": "mart.exam_timing", "body": "VIEW · calculated when queried\nreport_at = COALESCE(first_finalized_at, finalized_at)\norder_to_capture_min = seconds(image_captured_at − ordered_at) / 60\ncapture_to_report_min = seconds(report_at − image_captured_at) / 60\norder_to_report_min = seconds(report_at − ordered_at) / 60\nEach missing/negative interval → NULL\nOnly is_deleted = false", "stage": 2, "level": 2}, {"id": "widget", "title": "Process Time by modality", "body": "Capture p50 / p90 = percentile(order_to_capture_min, 50% / 90%)\nReading p50 / p90 = percentile(capture_to_report_min, 50% / 90%)\nTotal p50 / p90 = percentile(order_to_report_min, 50% / 90%)\n>4h pct = 100 × COUNT(order_to_report_min > 240) / COUNT(order_to_report_min)\nGroup by modality_id and modality_name", "stage": 3, "level": 3}], "edges": [["s0", "fact"], ["s1", "fact"], ["s3", "fact"], ["s4", "fact"], ["s2", "modality"], ["fact", "timing"], ["timing", "widget"], ["modality", "widget"]]}, "note": "Percentiles of phases cannot be added to obtain the total percentile.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "One exam journey, three measured phases", "headers": ["Exam", "Order time", "Capture time", "First finalized report time"], "before": [["Demo A", "09:00", "09:05", "09:10"], ["Demo B", "09:00", "09:05", "09:20"], ["Demo C", "09:00", "09:05", "09:30"], ["Demo D", "09:00", "09:05", "09:40"], ["Demo E", "09:00", "09:05", "14:00"]], "after": [["Mean order → capture", "5 min", "All five share this phase"], ["Mean capture → report", "75 min", "5, 15, 25, 35, 295 min"], ["Mean order → report", "80 min", "5 + 75 on the same complete cohort"]], "answer": "Using the same five exams with all required times, phase means add to total mean. Total p50 = 30 min; p90 = 196 min using continuous interpolation. Four of five totals are ≤4 hours (80%); one is >4–24 hours (20%). Phase percentiles must not be added.", "bars": [["Mean order → capture", 5], ["Mean capture → report", 75], ["Mean order → report", 80]], "unit": "min"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/process_time_by_modality.sql", "code": "SELECT m.modality_name AS \"Modality\",\n       count(*)::bigint AS \"Exams\",\n       count(f.order_to_capture_min)::bigint AS \"Capture n\",\n       round((percentile_cont(0.5) WITHIN GROUP (ORDER BY f.order_to_capture_min))::numeric, 1) AS \"Capture p50 (min)\",\n       round((percentile_cont(0.9) WITHIN GROUP (ORDER BY f.order_to_capture_min))::numeric, 1) AS \"Capture p90 (min)\",\n       count(f.capture_to_report_min)::bigint AS \"Reading n\",\n       round((percentile_cont(0.5) WITHIN GROUP (ORDER BY f.capture_to_report_min))::numeric, 1) AS \"Reading p50 (min)\",\n       round((percentile_cont(0.9) WITHIN GROUP (ORDER BY f.capture_to_report_min))::numeric, 1) AS \"Reading p90 (min)\",\n       count(f.order_to_report_min)::bigint AS \"Total n\",\n       round((percentile_cont(0.5) WITHIN GROUP (ORDER BY f.order_to_report_min))::numeric, 1) AS \"Total p50 (min)\",\n       round((percentile_cont(0.9) WITHIN GROUP (ORDER BY f.order_to_report_min))::numeric, 1) AS \"Total p90 (min)\",\n       round(100.0 * count(*) FILTER (WHERE f.order_to_report_min > 240)\n             / nullif(count(f.order_to_report_min), 0), 1) AS \">4h pct\"\nFROM mart.exam_timing f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE {where}\nGROUP BY m.modality_id, m.modality_name\nORDER BY \"Exams\" DESC, m.modality_name;\n"}]}, {"label": "AI Result Records / AI Result Activity", "family": "AI", "status": "Implemented calculation", "sources": [["RIS_EXAMRESULTAI", "EXAM_RESULT_AI_ID, ACCESSION_NO, CREATED_ON, ABNORMALITY_SCORE, RAD_AGREED", "AI output date, score and review codes"], ["RIS_ORDERDTL + RIS_MODALITY + RIS_MODALITYTYPE", "ACCESSION_NO, MODALITY_ID, MODALITY_TYPE, TYPE_NAME", "Optional source modality link and type lookup; unmatched remains unknown"]], "transform": "Group bounded source pages by creation date, modality and score band/finding. Retain event count, scored count and score sum. COPY temporary aggregates; roll up to daily marts atomically.", "storage": "Daily aggregate rows in dw.dim_modality, mart.ai_result_daily. Event counts preserve source record totals; individual AI records are not retained.", "tables": ["dw.dim_modality", "mart.ai_result_daily"], "formula": "SUM(event_count) by AI creation day. Card = sum of the displayed day's counts.", "flow": {"nodes": [{"id": "s0", "title": "RIS_EXAMRESULTAI", "body": "EXAM_RESULT_AI_ID, ACCESSION_NO, CREATED_ON, ABNORMALITY_SCORE, RAD_AGREED", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL + RIS_MODALITY + RIS_MODALITYTYPE", "body": "ACCESSION_NO, MODALITY_ID, MODALITY_TYPE, TYPE_NAME", "stage": 0, "level": 0}, {"id": "ai", "title": "mart.ai_result_daily", "body": "SAVED TABLE · daily grouped records\nevent_day = date(RIS_EXAMRESULTAI.CREATED_ON)\nevent_count = COUNT(source rows)\nscore_count = COUNT(non-NULL ABNORMALITY_SCORE)\nscore_sum = SUM(ABNORMALITY_SCORE); missing sum → 0\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nscore_bucket = band(ABNORMALITY_SCORE)\nreviewed_count = COUNT(RAD_AGREED in Y,N)\nagreed_count = COUNT(RAD_AGREED = Y)\ndisagreed_count = COUNT(RAD_AGREED = N)\nGroup by event_day, modality_id, score_bucket", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME", "stage": 2, "level": 1}, {"id": "widget", "title": "AI Result Records / AI Result Activity", "body": "result_records = SUM(event_count)\nscored_records = SUM(score_count)\nmean_score = SUM(score_sum) / SUM(score_count)\nreviewed_records = SUM(reviewed_count)\nagreed_records = SUM(agreed_count)\ndisagreed_records = SUM(disagreed_count)\nGroup by event_day; card totals selected daily result_records", "stage": 3, "level": 2}], "edges": [["s0", "ai"], ["s1", "ai"], ["s1", "modality"], ["ai", "widget"], ["modality", "widget"]]}, "note": "Stored outputs, not distinct exams/patients or successful model runs. No model is run by this app.", "context": "AI CREATION dates and modality type; not order dates", "example": {"title": "AI records → saved score summaries", "headers": ["Record", "Creation day", "Score"], "before": [["Demo A", "Day 1", "0.2"], ["Demo B", "Day 1", "0.8"], ["Demo C", "Day 1", "Missing"]], "after": [["Day 1", "3 records", "2 scores; sum = 1.0"]], "answer": "Activity = 3 records. Score mean = 1.0 / 2 = 0.5. Missing scores are not zeros. A score is not a confirmed diagnosis.", "bars": [["Recorded outputs", 3], ["Scored outputs", 2]], "unit": "records"}, "codes": [{"path": "sql/sqlserver/ai_result_daily_extract.sql", "code": "-- Parameters: page size, previous primary key, fixed maximum primary key.\nWITH page AS (\n    SELECT TOP (?) EXAM_RESULT_AI_ID, ACCESSION_NO, CREATED_ON,\n           ABNORMALITY_SCORE, RAD_AGREED\n    FROM dbo.RIS_EXAMRESULTAI\n    WHERE EXAM_RESULT_AI_ID > ? AND EXAM_RESULT_AI_ID \u003c= ?\n    ORDER BY EXAM_RESULT_AI_ID\n)\nSELECT CAST(a.CREATED_ON AS date) AS event_day, d.MODALITY_ID,\n       CASE WHEN a.ABNORMALITY_SCORE IS NULL THEN 'Missing'\n            WHEN a.ABNORMALITY_SCORE \u003c 0 OR a.ABNORMALITY_SCORE > 1 THEN 'Outside 0-1'\n            WHEN a.ABNORMALITY_SCORE \u003c .2 THEN '0.0-\u003c0.2'\n            WHEN a.ABNORMALITY_SCORE \u003c .4 THEN '0.2-\u003c0.4'\n            WHEN a.ABNORMALITY_SCORE \u003c .6 THEN '0.4-\u003c0.6'\n            WHEN a.ABNORMALITY_SCORE \u003c .8 THEN '0.6-\u003c0.8'\n            ELSE '0.8-1.0' END AS score_bucket,\n       COUNT_BIG(*) AS event_count, COUNT_BIG(a.ABNORMALITY_SCORE) AS score_count,\n       COALESCE(SUM(CAST(a.ABNORMALITY_SCORE AS decimal(38,10))), 0) AS score_sum,\n       SUM(CAST(CASE WHEN a.RAD_AGREED IN ('Y','N') THEN 1 ELSE 0 END AS bigint)) AS reviewed_count,\n       SUM(CAST(CASE WHEN a.RAD_AGREED = 'Y' THEN 1 ELSE 0 END AS bigint)) AS agreed_count,\n       SUM(CAST(CASE WHEN a.RAD_AGREED = 'N' THEN 1 ELSE 0 END AS bigint)) AS disagreed_count,\n       MAX(a.EXAM_RESULT_AI_ID) AS page_key\nFROM page a\nLEFT JOIN dbo.RIS_ORDERDTL d ON d.ACCESSION_NO = a.ACCESSION_NO\nGROUP BY CAST(a.CREATED_ON AS date), d.MODALITY_ID,\n       CASE WHEN a.ABNORMALITY_SCORE IS NULL THEN 'Missing'\n            WHEN a.ABNORMALITY_SCORE \u003c 0 OR a.ABNORMALITY_SCORE > 1 THEN 'Outside 0-1'\n            WHEN a.ABNORMALITY_SCORE \u003c .2 THEN '0.0-\u003c0.2'\n            WHEN a.ABNORMALITY_SCORE \u003c .4 THEN '0.2-\u003c0.4'\n            WHEN a.ABNORMALITY_SCORE \u003c .6 THEN '0.4-\u003c0.6'\n            WHEN a.ABNORMALITY_SCORE \u003c .8 THEN '0.6-\u003c0.8'\n            ELSE '0.8-1.0' END\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/rollup_integration_stage.sql", "code": "-- Dimensions and measures are trusted SQL fragments from DATASETS, not runtime input.\nINSERT INTO mart.{table}\nSELECT {dimensions}, {measures} FROM stage GROUP BY {dimensions};\n"}, {"path": "sql/postgres/02_ai_hl7.sql", "code": "-- Daily serving aggregates, not patient-level facts. Source dates are Bangkok dates.\n-- Nullable dates preserve undated source records for coverage reporting.\nCREATE TABLE IF NOT EXISTS mart.ai_result_daily (\n    event_day date, modality_id integer, score_bucket text NOT NULL,\n    event_count bigint NOT NULL, score_count bigint NOT NULL,\n    score_sum numeric NOT NULL, reviewed_count bigint NOT NULL,\n    agreed_count bigint NOT NULL, disagreed_count bigint NOT NULL\n);\nCREATE INDEX IF NOT EXISTS ai_result_daily_date_modality\n    ON mart.ai_result_daily (event_day, modality_id);\nCREATE TABLE IF NOT EXISTS mart.ai_finding_daily (\n    event_day date, modality_id integer, finding_name text,\n    event_count bigint NOT NULL, score_co y": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME", "stage": 2, "level": 1}, {"id": "widget", "title": "Mean AI score by finding / score ranges", "body": "finding_records = SUM(event_count)\nscored_records = SUM(score_count)\nmean_score = SUM(score_sum) / SUM(score_count)\nmin_score = MIN(score_min); max_score = MAX(score_max)\nGroup by finding_name; show largest 25 mean_score values", "stage": 3, "level": 2}], "edges": [["s0", "ai"], ["s1", "ai"], ["s2", "ai"], ["s1", "modality"], ["ai", "widget"], ["modality", "widget"]]}, "note": "Weighted across records, not daily means. A finding row is not a positive diagnosis. Source sums use decimal(38,10).", "context": "AI CREATION dates and modality type; not order dates", "example": {"title": "AI records → saved score summaries", "headers": ["Record", "Creation day", "Score"], "before": [["Demo A", "Day 1", "0.2"], ["Demo B", "Day 1", "0.8"], ["Demo C", "Day 1", "Missing"]], "after": [["Day 1", "3 records", "2 scores; sum = 1.0"]], "answer": "Activity = 3 records. Score mean = 1.0 / 2 = 0.5. Missing scores are not zeros. A score is not a confirmed diagnosis.", "bars": [["Recorded outputs", 3], ["Scored outputs", 2]], "unit": "records"}, "codes": [{"path": "sql/sqlserver/ai_finding_daily_extract.sql", "code": "WITH page AS (\n    SELECT TOP (?) EXAM_RESULT_AI_DTL_ID, EXAM_RESULT_AI_ID,\n           FINDING_NAME, FINDING_SCORE\n    FROM dbo.RIS_EXAMRESULTAIDTL\n    WHERE EXAM_RESULT_AI_DTL_ID > ? AND EXAM_RESULT_AI_DTL_ID \u003c= ?\n    ORDER BY EXAM_RESULT_AI_DTL_ID\n)\nSELECT CAST(a.CREATED_ON AS date) AS event_day, d.MODALITY_ID, f.FINDING_NAME,\n       COUNT_BIG(*) AS event_count, COUNT_BIG(f.FINDING_SCORE) AS score_count,\n       COALESCE(SUM(CAST(f.FINDING_SCORE AS decimal(38,10))), 0) AS score_sum,\n       MIN(f.FINDING_SCORE) AS score_min, MAX(f.FINDING_SCORE) AS score_max,\n       MAX(f.EXAM_RESULT_AI_DTL_ID) AS page_key\nFROM page f\nLEFT JOIN dbo.RIS_EXAMRES function menu(){const needle=$('search').value.toLowerCase(),family=$('family').value;let group='';let visible=0;$('catalog').innerHTML=DATA.map((d,i)=>{if(family&&d.family!==family)return '';if(needle&&!JSON.stringify([d.label,d.sources,d.tables,d.formula,d.note]).toLowerCase().includes(needle))return '';visible++;let heading=d.family!==group?`<div class="group">${escape(d.family)}</div>`:'';group=d.family;return heading+`<button class="item" data-widget="${i}" aria-current="${i===selected}">${escape(d.label)}<small>${escape(d.status)}</small></button>`}).join('');$('count').textContent=`${visible} explanations · offline code guide`;if(!visible)$('catalog').innerHTML='<p class="muted">No matching widget. Clear search or change the family.</p>';document.querySelectorAll('[data-widget]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.widget)));}

 if(!d.flow)return `<div class="notice">${escape(d.note)}<p>No verified source-to-widget calculation is available.</p></div>`;

function scaleDiagram(fit=false){const svg=$('mermaid-view')?.querySelector('svg');if(!svg)return;const width=svg.viewBox.baseVal.width;if(fit)diagramScale=Math.min(1,($('mermaid-view').clientWidth-24)/width);svg.style.width=(width*diagramScale)+'px';svg.style.height='auto';svg.style.maxWidth='none';}
async function drawDiagram(){
 const d=DATA[selected],request=++renderSerial;if(!d.flow)return;
 const direction=$('direction').value;
 const label=t=>'"'+String(t).replaceAll('"','#quot;').replaceAll('<','#lt;').replaceAll('>','#gt;').replaceAll('\n',' ')+'"';
 const parts=['flowchart '+direction,'subgraph source["SQL Server · RIS_CU"]'];
 for(const n of d.flow.nodes.filter(n=>n.level===0))parts.push(n.id+'['+label(n.title)+']');
 parts.push('end','subgraph target["PostgreSQL · transformed tables / views"]');
 for(const n of d.flow.nodes.filter(n=>n.level>0&&n.id!=='widget'))parts.push(n.id+'['+label(n.title)+']');
 parts.push('end','widget(['+label(widgetTitle(d))+'])');
 for(const [a,b] of d.flow.edges)parts.push(a+' --> '+b);
 parts.push('classDef sourceNode fill:#e9f1ff,stroke:#5776ac,color:#142e50','classDef targetNode fill:#e8f6f0,stroke:#297c68,color:#153d33','classDef widgetNode fill:#fff0cd,stroke:#b1872e,color:#4b3610');
 for(const n of d.flow.nodes)parts.push('class '+n.id+' '+(n.level===0?'sourceNode':n.id==='widget'?'widgetNode':'targetNode'));
 try{
  const {svg}=await mermaid.render('widget-diagram-'+request,parts.join('\n'));
  if(request!==renderSerial||!$('mermaid-view'))return;
  $('mermaid-view').innerHTML=svg;diagramScale=1;scaleDiagram(true);
  for(const n of d.flow.nodes){
   const title=n.id==='widget'?widgetTitle(d):n.title;
   const el=[...$('mermaid-view').querySelectorAll('g.node')].find(e=>e.textContent.trim()===title);if(!el)continue;
   el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',names[n.stage]+': '+n.title);
   const activate=()=>{selectedNode=n.id;stage=n.stage;showStage();$('detail').scrollIntoView({block:'nearest',behavior:'smooth'});};
   el.onclick=activate;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}};
  }
 }catch(error){if(request===renderSerial&&$('mermaid-view'))$('mermaid-view').innerHTML='<div class="notice">Unable to draw this diagram. Table mappings and equations remain available below.</div>';console.error(error);}
}

function showStage(){const d=DATA[selected],node=d.flow?.nodes.find(n=>n.id===selectedNode);let body='';if(stage===0)body=table(['SQL Server table','Columns used','Why the widget needs them'],(node&&node.level===0?[d.sources[Number(node.id.slice(1))]]:d.sources))+ '<p class="muted">Accession links are used at source; no patient identity or clinical narrative is embedded in this guide. Column arrows (←) mean copied or mapped from the named source column.</p>';if(stage===1)body=`<p>${escape(d.transform)}</p><p class="muted">Full historical refresh. This prototype is not a CDC or live streaming dashboard. Failure rolls back target publication.</p>`;if(stage===2)body=`<h3>${escape(node?.title||'PostgreSQL')}</h3><div class="math column-details">${escape(node?.body||d.storage)}</div><p>${escape(d.storage)}</p><h3>Tables and views used by the dashboard query</h3><p>${d.tables.map(t=>`<code>${escape(t)}</code>`).join(' · ')}</p><p class="muted">Tables store data; views expose a query; materialized views store a refreshed query result. The precise definitions are in the SQL below.</p>`;if(stage===3)body=`<div class="math">${escape(d.flow.nodes.find(n=>n.id==='widget').body)}</div><h3>Calculation rules</h3><p>${escape(d.formula)}</p><p class="muted">The exact implementation is the dashboard SELECT query in the SQL section. Percentiles are calculated from exam durations, not by averaging daily percentiles.</p>`;if(stage===4)body=`<div class="notice">${escape(d.note)}</div><p><strong>Selection rule:</strong> ${escape(d.context)}</p><p class="muted">A displayed zero means no qualifying events among measurable records. An unavailable duration does not mean zero time. Partial days and changing case mix can affect comparisons.</p>`;const files=d.codes.filter(c=>stage===0?c.path.includes('/sqlserver/'):stage===1?c.path.includes('/load/'):stage===2?/\/(01_schema|02_ai_hl7|03_stroke_candidates|04_capture_workflow)\.sql$/.test(c.path):stage===3?c.path.includes('/dashboard/'):false);bo $('content').innerHTML=`<span class="badge ${d.status==='Implemented calculation'?'':'warn'}">${escape(d.status)}</span><h2>${escape(d.label)}</h2><p class="muted">Choose a widget from the widget list. Read its source tables, follow the arrows through transformed tables, then read the column equations below the diagram.</p><div class="facts"><div class="fact"><strong>Date and filter</strong>${escape(d.context)}</div><div class="fact"><strong>What this number means</strong>${escape(d.note)}</div></div>${diagram(d)}<section id="detail" class="panel detail"></section><details open><summary>Worked example · see the number being built</summary><p class="examplelabel">Fictional teaching data — not a patient sample or dashboard result</p><h3>${escape(d.example.title)}</h3><div class="sample"><div><h3>Before · source columns used</h3>${table(d.example.headers,d.example.before)}</div><div><h3>After · calculated results</h3>${table(['Output','Value','Meaning'],d.example.after)}</div></div><div class="math" style="margin-top:16px">${escape(d.example.answer)}</div><div class="svgwrap">${plot(d.example)}</div><p class="muted">This example teaches the arithmetic for this data family. The calculation panel gives the exact column equations. Grouping, eligibility and output are defined by the dashboard query. Actual selected results are in Streamlit Data Explorer.</p></details><details><summary>SQL for reading, saving and calculating data · for senior review</summary><p class="muted">Embedded from repository files when this guide is generated. These panels display code; they do not execute it. seconds(end − start) means elapsed seconds, matching EXTRACT(EPOCH FROM ...) in PostgreSQL. COUNT(condition) in the equations means count rows where the condition is true (SQL COUNT(*) FILTER), not SQL COUNT(boolean). Percentiles use percentile_cont and ignore NULL durations. Zero denominators produce NULL, not zero.</p>${d.codes.map(c=>`<details><summary>${escape(c.path)}</summary><pre>${escape(c.code)}</pre></details>`).join('')}</details><details><summary>Terms and definitions</summary><div class="glossary"><p><strong>Exam versus order:</strong> one order can contain multiple exam details. Neither count is a patient count.</p><p><strong>Median / p50:</strong> middle duration after sorting; half the measured durations are at or below it.</p><p><strong>p90:</strong> duration at or below which 90% of the measured durations fall; it describes the slower tail.</p><p><strong>Mean:</strong> total measured duration divided by number of measured exams; long delays can pull it upward.</p><p><strong>IQR:</strong> Q3 − Q1. Statistical outliers lie outside Q1 − 1.5×IQR and Q3 + 1.5×IQR.</p><p><strong>30 min / 4 hours:</strong> fixed comparison thresholds in this prototype, not automatically validated hospital SLA targets.</p><p><strong>Count / COUNT_BIG:</strong> counts rows; COUNT_BIG is SQL Server's bigint result. Meaning depends on what a row represents.</p><p><strong>Unavailable:</strong> missing source or unsuitable definition. It is not a zero duration or zero incident count.</p></div></details><div class="footer">Source: SQL Server 10.10.12.97 / RIS_CU → PostgreSQL radops_cu_prototype → Streamlit. This offline guide embeds code and fictional examples only; it makes no database calls. Regenerate with <code>python prototypes/radops_star/build_widget_guide.py</code> after SQL or catalog changes.</div>`;
