:root{color-scheme:light;--bg:#f7f7f2;--panel:#fff;--ink:#193341;--muted:#526876;--line:#d7e2e2;--teal:#146e67;--soft:#e7f3ee;--amber:#805316;--warn:#fff2d9;--code:#172a36;--codeink:#edf8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--teal)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #c99732;outline-offset:3px}
header{padding:28px 34px 22px;border-bottom:1px solid var(--line);background:var(--panel)}.kicker{text-transform:uppercase;letter-spacing:.13em;color:var(--teal);font-size:11px;font-weight:800}h1{font-size:clamp(26px,3vw,40px);line-height:1.2;margin:8px 0}h2{font-size:25px;line-height:1.25;margin:6px 0 12px}h3{font-size:17px;margin:0 0 10px}p{margin:8px 0}.muted{color:var(--muted)}.toplinks{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:14px}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1700px;margin:auto}aside{padding:22px 18px;border-right:1px solid var(--line);position:sticky;top:0;max-height:100vh;overflow:auto}main{padding:26px 30px;min-width:0}label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);margin-bottom:14px}.item{display:block;width:100%;border:1px solid transparent;text-align:left;padding:11px 12px;background:transparent;color:var(--ink);border-radius:9px;margin:3px 0;font-size:13px}.item:hover{background:var(--soft)}.item[aria-current="true"]{border-color:var(--teal);background:var(--soft);font-weight:700}.item small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.group{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin:16px 10px 6px;color:var(--muted)}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:var(--soft);color:var(--teal);font-size:12px;font-weight:700}.badge.warn{background:var(--warn);color:var(--amber)}.notice{border-left:4px solid #c89735;background:var(--warn);padding:12px 16px;border-radius:8px;color:var(--ink);margin:16px 0}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:22px 0}.step{position:relative;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:15px;color:var(--ink);min-height:150px}.step:not(:last-child):after{content:'→';position:absolute;right:-13px;top:60px;color:var(--teal);z-index:1;font-weight:800}.step[aria-pressed="true"]{border:2px solid var(--teal);background:var(--soft);padding:14px}.number{display:block;color:var(--teal);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.07em}.step strong{display:block;font-size:16px;margin:6px 0}.step span:last-child{font-size:12px;color:var(--muted);display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:22px;margin:16px 0}.detail{min-height:195px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.fact{padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px}.fact strong{display:block;color:var(--teal);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft);font-weight:700}code{font-family:Consolas,monospace;font-size:12px;overflow-wrap:anywhere}pre{background:var(--code);color:var(--codeink);padding:18px;border-radius:9px;overflow:auto;max-height:460px;font:12px/1.65 Consolas,monospace;white-space:pre}details{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 18px;margin:12px 0}summary{font-weight:700;cursor:pointer}.sample{display:grid;grid-template-columns:1fr 1fr;gap:16px}.math{font-size:17px;background:var(--soft);padding:16px;border-radius:10px;white-space:pre-wrap}.examplelabel{color:var(--amber);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.svgwrap{max-width:760px;margin:18px auto}.footer{border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted);margin-top:28px}.glossary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.glossary p{font-size:13px;margin:0;padding:12px;background:var(--soft);border-radius:8px}.plainbutton{background:var(--soft);color:var(--teal);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#10202a;--panel:#192f3b;--ink:#edf6f9;--muted:#b5c9d2;--line:#425d6a;--teal:#8cded0;--soft:#20433f;--amber:#f0ca84;--warn:#413726;--code:#091820;--codeink:#edf8ff}}
@media(max-width:1000px){.layout{grid-template-columns:235px minmax(0,1fr)}.steps{grid-template-columns:repeat(3,1fr)}.step:after{display:none}main{padding:20px}.sample{grid-template-columns:1fr}}
@media(max-width:680px){header{padding:20px}.layout{display:block}aside{position:static;max-height:320px;border-bottom:1px solid var(--line)}.steps{grid-template-columns:1fr 1fr}.facts,.glossary{grid-template-columns:1fr}h2{font-size:23px}}
@media print{aside,.toplinks,.plainbutton{display:none}.layout{display:block}header,main{padding:12px}.panel,details,.step{break-inside:avoid}pre{max-height:none}.steps{grid-template-columns:repeat(5,1fr)}body{background:white;color:black}}

.diagram{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px;margin:20px 0;padding:12px}.diagram svg{display:block;width:100%;min-width:500px}.diagram .edge{fill:none;stroke:var(--teal);stroke-width:2;marker-end:url(#arrow)}.diagram .node{cursor:pointer;outline:none}.diagram .node rect{fill:var(--panel);stroke:var(--line);stroke-width:2}.diagram .node:hover rect,.diagram .node:focus rect{stroke:var(--teal);stroke-width:3}.diagram .node[aria-pressed="true"] rect{fill:var(--soft);stroke:var(--teal);stroke-width:3}.diagram text{fill:var(--ink);font:14px system-ui,Segoe UI,sans-serif}.diagram .node-title{font-weight:750}.diagram .column-math{font:15px Consolas,monospace;fill:var(--ink)}.diagram .node-note{fill:var(--muted);font-size:12px}.diagram .lane{fill:var(--teal);font-size:12px;font-weight:800;letter-spacing:1px}.diagram .edge-label{fill:var(--muted);font-size:11px}.diagram-hint{margin:0 0 8px;font-size:13px;color:var(--muted)}
@media(max-width:1100px){.layout{display:block}aside{position:static;max-height:260px;border-right:0;border-bottom:1px solid var(--line)}#catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.group{grid-column:1/-1;margin:3px 10px}.item{margin:0;padding:8px}.diagram svg{min-width:650px}main{padding:20px}}

<header><div class="kicker">RIS_CU · Widget data flow</div><h1>How each widget gets its numbers</h1><p class="muted">Source tables → transformed PostgreSQL tables and views → dashboard widgets. Click a table for column mappings, or a widget for its column equations.</p><div class="toplinks"><a href="http://localhost:8501/">Open dashboard &amp; Data Explorer</a><button class="plainbutton" id="print">Print selected explanation</button></div></header>
<div class="layout"><aside aria-label="Choose a widget"><label for="search">Find a widget or table</label><input id="search" type="search" placeholder="TAT, TECHWORKS, AI, HL7…"><label for="family">Data family</label><select id="family"><option value="">All families</option><option>Exam</option><option>AI</option><option>HL7</option><option>Validation</option><option>Unavailable</option></select><div id="count" class="muted" style="font-size:12px"></div><nav id="catalog" aria-label="Widget list"></nav></aside><main id="content" aria-live="polite"></main></div>

<script>
'use strict';
const DATA=[{"label": "Investigation duplicate candidates", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, HN, VISIT_NO, ORG_ID, ORDER_START_TIME, IS_CANCELED", "Patient and visit used only for grouping at source; never copied"], ["RIS_ORDERDTL", "EXAM_ID, MODALITY_ID, SERVICE_TYPE, IMAGE_CAPTURED_ON, IS_DELETED", "Use recorded service type; count capture timestamp presence"], ["RIS_EXAM", "EXAM_ID, SERVICE_TYPE", "Fallback to exam-definition service UID only when detail SERVICE_TYPE is NULL"], ["RIS_SERVICETYPE", "SERVICE_TYPE_ID, SERVICE_TYPE_UID, SERVICE_TYPE_TEXT", "Verify ID 1 / UID 1 = Investigation"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_TYPE, TYPE_NAME", "Existing dimension for selected modality-type filter"]], "transform": "Filter Investigation services and exclude canceled/deleted records at source. GROUPING SETS builds both same-visit and same-day groups; count exams/capture, flag uncaptured members of repeated captured groups. COPY summaries only, validate identical population totals for both rules, and publish table + audit atomically.", "storage": "mart.investigation_groups: group summaries, not individual patient records. Patient and visit identities are never copied. Each matching rule covers the same population; select one rule.", "tables": ["dw.dim_modality", "mart.investigation_groups"], "formula": "suspected_uncaptured = exam_records - captured_exams only in repeated groups with capture and complete matching keys; what_if_exams = exam_records - suspected_uncaptured. Sum groups by selected rule/date/modality.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, HN, VISIT_NO, ORG_ID, ORDER_START_TIME, IS_CANCELED", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "EXAM_ID, MODALITY_ID, SERVICE_TYPE, IMAGE_CAPTURED_ON, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_EXAM", "body": "EXAM_ID, SERVICE_TYPE", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_SERVICETYPE", "body": "SERVICE_TYPE_ID, SERVICE_TYPE_UID, SERVICE_TYPE_TEXT", "stage": 0, "level": 0}, {"id": "s4", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_TYPE, TYPE_NAME", "stage": 0, "level": 0}, {"id": "investigations", "title": "mart.investigation_groups", "body": "SAVED GROUP TABLE\nmatch_rule = same_visit or same_day\norder_day = Bangkok date(ORDER_START_TIME)\nanchor_order_id = MIN(ORDER_ID) within group\nexam_id, modality_id ← RIS_ORDERDTL\nexam_records = COUNT(group members)\ncaptured_exams = COUNT(IMAGE_CAPTURED_ON not NULL)\nsuspected_uncaptured = unmatched capture registrations in repeated captured groups\nPatient and visit fields used at source only; not stored", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED DIMENSION\nmodality_id, modality_type and names\nFilters the groups by modality type", "stage": 2, "level": 1}, {"id": "widget", "title": "Investigation duplicate candidates", "body": "Use detail SERVICE_TYPE = 1; if NULL, use exam-definition SERVICE_TYPE = '1'\nExclude IS_DELETED = Y and IS_CANCELED = Y\nGroup by organization + patient + day + exam + modality, optionally visit\nexam_records = COUNT(exam details in group)\ncaptured_exams = COUNT(IMAGE_CAPTURED_ON not NULL)\nsuspected_uncaptured = exam_records − captured_exams when exam_records > 1, captured_exams > 0 and matching_keys_complete\nOtherwise suspected_uncaptured = 0\nwhat_if_exams = exam_records − suspected_uncaptured\nSelected totals = SUM(group counts) for ONE match_rule\nSuspected, not confirmed duplicates; raw orders retained", "stage": 3, "level": 2}], "edges": [["s0", "investigations"], ["s1", "investigations"], ["s2", "investigations"], ["s3", "investigations"], ["s4", "investigations"], ["s4", "modality"], ["investigations", "widget"], ["modality", "widget"]]}, "note": "Investigation service type 1 only, explicit canceled/deleted records excluded. Suspected duplicates are not confirmed errors. Both matching rules cover the same population; never sum rules.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "Three registrations for the same patient, visit, day and exam", "headers": ["Registration", "Capture timestamp", "Same matching group"], "before": [["Demo A", "Present", "Yes"], ["Demo B", "Missing", "Yes"], ["Demo C", "Missing", "Yes"]], "after": [["Recorded exams", "3", "All registrations retained"], ["With capture", "1", "One recorded capture"], ["Suspected extras", "2", "No capture; matches a captured registration"], ["What-if count", "1", "3 − 2, not confirmed unique investigations"]], "answer": "The what-if scenario keeps the captured registration and subtracts two suspected extras. Legitimate repeated exams may match this rule; no source records are deleted.", "bars": [["Recorded exams", 3], ["With capture", 1], ["What-if count", 1]], "unit": "exam records"}, "codes": [{"path": "sql/sqlserver/investigation_groups.sql", "code": "-- HN and VISIT_NO are used only inside SQL Server; never returned or copied.\n-- SERVICE_TYPE_ID=1 / SERVICE_TYPE_UID='1' is Investigation in RIS_CU.\nWITH eligible AS (\n SELECT d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID, CAST(o.ORDER_START_TIME AS date) AS order_day,\n        o.ORG_ID,\n        CASE WHEN NULLIF(LTRIM(RTRIM(o.HN)), '') IS NULL\n             THEN CONCAT('missing:', o.ORDER_ID) ELSE CONCAT('patient:', LTRIM(RTRIM(o.HN))) END AS patient_key,\n        CASE WHEN NULLIF(LTRIM(RTRIM(o.VISIT_NO)), '') IS NULL\n             THEN CONCAT('missing:', o.ORDER_ID) ELSE CONCAT('visit:', LTRIM(RTRIM(o.VISIT_NO))) END AS visit_key,\n        CASE WHEN NULLIF(LTRIM(RTRIM(o.HN)), '') IS NULL THEN 0 ELSE 1 END AS patient_known,\n        CASE WHEN NULLIF(LTRIM(RTRIM(o.VISIT_NO)), '') IS NULL THEN 0 ELSE 1 END AS visit_known,\n        CASE WHEN d.IMAGE_CAPTURED_ON IS NOT NULL THEN 1 ELSE 0 END AS captured,\n        CASE WHEN d.SERVICE_TYPE=1 THEN 1 ELSE 0 END AS detail_service\n FROM dbo.RIS_ORDERDTL d\n JOIN dbo.RIS_ORDER o ON o.ORDER_ID=d.ORDER_ID\n JOIN dbo.RIS_EXAM e ON e.EXAM_ID=d.EXAM_ID\n WHERE (d.SERVICE_TYPE=1 OR (d.SERVICE_TYPE IS NULL AND e.SERVICE_TYPE='1'))\n   AND COALESCE(d.IS_DELETED,'') \u003c> 'Y'\n   AND COALESCE(o.IS_CANCELED,'') \u003c> 'Y' AND o.ORDER_START_TIME IS NOT NULL\n), grouped AS (\n SELECT CASE WHEN GROUPING(visit_key)=0 THEN 'same_visit' ELSE 'same_day' END AS match_rule,\n        order_day, MIN(ORDER_ID) AS anchor_order_id, EXAM_ID, MODALITY_ID,\n        COUNT_BIG(*) AS exam_records, SUM(CAST(captured AS bigint)) AS captured_exams,\n        SUM(CAST(detail_service AS bigint)) AS detail_service_exams,\n        CASE WHEN GROUPING(visit_key)=0 THEN MIN(patient_known)*MIN(visit_known)\n             ELSE MIN(patient_known) END AS matching_keys_complete\n FROM eligible\n GROUP BY GROUPING SETS (\n   (ORG_ID,patient_key,order_day,EXAM_ID,MODALITY_ID,visit_key),\n   (ORG_ID,patient_key,order_day,EXAM_ID,MODALITY_ID)\n )\n)\nSELECT match_rule,order_day,anchor_order_id,EXAM_ID,MODALITY_ID,\n       exam_records,captured_exams,matching_keys_complete,\n       CASE WHEN exam_records>1 AND captured_exams>0 AND matching_keys_complete=1\n            THEN exam_records-captured_exams ELSE CAST(0 AS bigint) END AS suspected_uncaptured,\n       detail_service_exams,exam_records-detail_service_exams AS definition_service_exams\nFROM grouped;\n"}, {"path": "sql/postgres/06_investigation_groups.sql", "code": "-- One group per rule + patient(/visit) + Bangkok day + exam + modality + source organization.\n-- Patient/visit identities are not retained. Anchor is the minimum source order ID,\n-- not a confirmed clinical investigation identifier.\nCREATE TABLE IF NOT EXISTS mart.investigation_groups (\n match_rule text NOT NULL CHECK (match_rule IN ('same_visit','same_day')),\n order_day date NOT NULL,\n anchor_order_id integer NOT NULL,\n exam_id integer NOT NULL,\n modality_id integer,\n exam_records bigint NOT NULL CHECK (exam_records > 0),\n captured_exams bigint NOT NULL CHECK (captured_exams BETWEEN 0 AND exam_records),\n matching_keys_complete boolean NOT NULL,\n suspected_uncaptured bigint NOT NULL CHECK (suspected_uncaptured BETWEEN 0 AND exam_records-captured_exams),\n detail_service_exams bigint NOT NULL DEFAULT 0,\n definition_service_exams bigint NOT NULL DEFAULT 0,\n PRIMARY KEY (match_rule,order_day,anchor_order_id,exam_id)\n);\n-- Remove the unused report count from this task's initial intermediate schema.\nALTER TABLE mart.investigation_groups DROP COLUMN IF EXISTS finalized_exams;\nALTER TABLE mart.investigation_groups ADD COLUMN IF NOT EXISTS detail_service_exams bigint NOT NULL DEFAULT 0;\nALTER TABLE mart.investigation_groups ADD COLUMN IF NOT EXISTS definition_service_exams bigint NOT NULL DEFAULT 0;\nCREATE INDEX IF NOT EXISTS investigation_groups_modality_day ON mart.investigation_groups (modality_id,order_day);\nCREATE TABLE IF NOT EXISTS mart.investigation_group_load_audit (\n singleton boolean PRIMARY KEY DEFAULT true CHECK (singleton),\n source_database text NOT NULL,\n group_rows bigint NOT NULL,\n investigation_exams bigint NOT NULL,\n loaded_at timestamptz NOT NULL DEFAULT now()\n);\n"}, {"path": "sql/postgres/dashboard/investigation_daily.sql", "code": "SELECT f.order_day, sum(f.exam_records)::bigint AS exam_records,\n       sum(f.captured_exams)::bigint AS captured_exams,\n       sum(f.suspected_uncaptured)::bigint AS suspected_uncaptured,\n       sum(f.exam_records-f.suspected_uncaptured)::bigint AS what_if_exams\nFROM mart.investigation_groups f LEFT JOIN dw.dim_modality m USING (modality_id)\nWHERE {where} GROUP BY f.order_day ORDER BY f.order_day;\n"}, {"path": "sql/postgres/dashboard/investigation_candidates.sql", "code": "SELECT f.order_day AS \"Order date\", COALESCE(m.modality_name,'Unknown modality') AS \"Modality\",\n       COALESCE(e.exam_name,'Unknown exam') AS \"Exam\", f.exam_records AS \"Recorded exams\",\n       f.captured_exams AS \"With capture\", f.suspected_uncaptured AS \"Suspected extra registrations\",\n       f.exam_records-f.suspected_uncaptured AS \"What-if exams\"\nFROM mart.investigation_groups f\nLEFT JOIN dw.dim_modality m USING (modality_id)\nLEFT JOIN dw.dim_exam e USING (exam_id)\nWHERE {where} AND f.suspected_uncaptured>0\nORDER BY f.suspected_uncaptured DESC,f.order_day DESC,f.anchor_order_id,f.exam_id LIMIT 50;\n"}, {"path": "sql/postgres/dashboard/investigation_summary.sql", "code": "SELECT COALESCE(sum(f.exam_records),0)::bigint AS exam_records,\n       COALESCE(sum(f.detail_service_exams),0)::bigint AS detail_service_exams,\n       COALESCE(sum(f.definition_service_exams),0)::bigint AS definition_service_exams,\n       COALESCE(sum(f.captured_exams),0)::bigint AS captured_exams,\n       COALESCE(sum(f.suspected_uncaptured),0)::bigint AS suspected_uncaptured,\n       COALESCE(sum(f.exam_records-f.suspected_uncaptured),0)::bigint AS what_if_exams,\n       count(*) FILTER (WHERE f.suspected_uncaptured>0)::bigint AS candidate_groups,\n       COALESCE(sum(f.exam_records) FILTER (WHERE NOT f.matching_keys_complete),0)::bigint AS unmatchable_exams,\n       COALESCE(sum(f.exam_records) FILTER (WHERE f.exam_records>1 AND f.captured_exams=0),0)::bigint AS repeated_without_capture\nFROM mart.investigation_groups f LEFT JOIN dw.dim_modality m USING (modality_id)\nWHERE {where};\n"}]}, {"label": "Capture workflow duration (TECHWORKS)", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_TECHWORKS", "ACCESSION_NO, START_TIME, END_TIME", "Recorded start and end times of the image-capture workflow."]], "transform": "Two separate loads meet at the serving query. The base exam-star loader provides order timestamps, modality and active-detail status. The capture workflow refresh joins TECHWORKS to detail by accession, streams keys + start/end pairs once, COPYs temporary logs and groups by order_id + exam_id. It keeps earliest start, latest end and completeness counts, then atomically replaces workflow summaries and audit.", "storage": "mart.capture_workflow: one optional summary per (order_id, exam_id), joined to the existing exam fact. Permanent storage contains summaries, not the original log rows.", "tables": ["dw.dim_modality", "dw.fact_exam", "mart.capture_workflow"], "formula": "For each exam with complete start/end records, calculate earliest start to latest end. Show daily median and 90th percentile in minutes.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_TECHWORKS", "body": "ACCESSION_NO, START_TIME, END_TIME", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nis_deleted: Y → true; N → false", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "capture", "title": "mart.capture_workflow", "body": "SAVED TABLE · one summary per order_id + exam_id\nMatch ACCESSION_NO at source\nfirst_started_at = MIN(START_TIME)\nlast_ended_at = MAX(END_TIME)\nlog_entries = COUNT(TECHWORKS rows)\npaired_entries = COUNT(START_TIME not NULL and END_TIME ≥ START_TIME)\nJoin fact by order_id + exam_id", "stage": 2, "level": 1}, {"id": "widget", "title": "Capture workflow duration (TECHWORKS)", "body": "minutes = seconds(last_ended_at − first_started_at) / 60\nInclude only log_entries = paired_entries and last_ended_at ≥ first_started_at\ncompleted_exams = COUNT(exam rows)\nmedian_minutes = percentile(minutes, 50%)\np90_minutes = percentile(minutes, 90%)\nGroup by order_day = Bangkok date(ordered_at)", "stage": 3, "level": 2}], "edges": [["s0", "fact"], ["s1", "fact"], ["s2", "modality"], ["s1", "capture"], ["s3", "capture"], ["fact", "widget"], ["modality", "widget"], ["capture", "widget"]]}, "note": "Total recorded workflow time includes gaps between entries. It does not measure repeat scans or the percentage of time a scanner is busy.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "Two recorded workflow periods for one exam", "headers": ["Exam", "START_TIME", "END_TIME"], "before": [["Demo A", "09:00", "09:10"], ["Demo A", "09:15", "09:25"]], "after": [["Demo A", "First start 09:00", "Last end 09:25"]], "answer": "25 min elapsed workflow = 09:25 − 09:00. The 5-minute gap is included; the two intervals are not added together.", "bars": [["First entry", 10], ["Gap", 5], ["Second entry", 10]], "unit": "min"}, "codes": [{"path": "sql/sqlserver/techworks_workflow_page.sql", "code": "-- Stream all linked workflow logs once, bounded by initial maximum detail order.\n-- Accession and clinical text remain inside this source query.\nSELECT d.ORDER_ID, d.EXAM_ID, tw.START_TIME, tw.END_TIME\nFROM dbo.RIS_TECHWORKS tw\nJOIN dbo.RIS_ORDERDTL d ON d.ACCESSION_NO = tw.ACCESSION_NO\nWHERE d.ORDER_ID \u003c= ?\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/aggregate_capture_workflow.sql", "code": "INSERT INTO capture_stage\nSELECT order_id,exam_id,count(*),\n       count(*) FILTER (WHERE started_at IS NOT NULL AND ended_at>=started_at),\n       min(started_at),max(ended_at)\nFROM capture_logs GROUP BY order_id,exam_id;\n"}, {"path": "sql/postgres/load/replace_capture_workflow.sql", "code": "DELETE FROM mart.capture_workflow;\nINSERT INTO mart.capture_workflow SELECT * FROM capture_stage;\nINSERT INTO mart.capture_workflow_load_audit\n    (source_database,source_max_order_id,workflow_exams)\nVALUES (%s,%s,%s)\nON CONFLICT (singleton) DO UPDATE SET\n    source_database=EXCLUDED.source_database,\n    source_max_order_id=EXCLUDED.source_max_order_id,\n    workflow_exams=EXCLUDED.workflow_exams, loaded_at=now();\nANALYZE mart.capture_workflow;\n"}, {"path": "sql/postgres/04_capture_workflow.sql", "code": "CREATE TABLE IF NOT EXISTS mart.capture_workflow (\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL,\n    log_entries bigint NOT NULL CHECK (log_entries > 0),\n    paired_entries bigint NOT NULL CHECK (paired_entries BETWEEN 0 AND log_entries),\n    first_started_at timestamptz,\n    last_ended_at timestamptz,\n    PRIMARY KEY (order_id, exam_id)\n);\nCREATE TABLE IF NOT EXISTS mart.capture_workflow_load_audit (\n    singleton boolean PRIMARY KEY DEFAULT true CHECK (singleton),\n    source_database text NOT NULL,\n    source_max_order_id integer,\n    workflow_exams bigint NOT NULL,\n    loaded_at timestamptz NOT NULL DEFAULT now()\n);\n"}, {"path": "sql/postgres/dashboard/capture_workflow_daily.sql", "code": "-- One exam's envelope, not summed log durations or scanner utilization.\nWITH intervals AS (\n SELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_day,\n        EXTRACT(EPOCH FROM (w.last_ended_at-w.first_started_at))/60.0 AS minutes\n FROM dw.fact_exam f\n JOIN dw.dim_modality m USING (modality_id)\n JOIN mart.capture_workflow w USING (order_id,exam_id)\n WHERE {where} AND f.is_deleted IS FALSE\n   AND w.log_entries=w.paired_entries\n   AND w.first_started_at IS NOT NULL AND w.last_ended_at>=w.first_started_at\n)\nSELECT order_day,COUNT(*) AS completed_exams,\n       percentile_cont(.5) WITHIN GROUP (ORDER BY minutes) AS median_minutes,\n       percentile_cont(.9) WITHIN GROUP (ORDER BY minutes) AS p90_minutes\nFROM intervals GROUP BY order_day ORDER BY order_day;\n"}]}, {"label": "STAT stroke candidates: capture / first final >30 min", "family": "Exam", "status": "Definition provisional", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_EXAMRESULT", "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "Report time: use first finalization when present, otherwise finalization"], ["RIS_ORDERDTL", "IMAGE_CAPTURED_ON", "Time image capture was recorded; patient arrival is a separate event"], ["RIS_ORDER", "CLINICAL_INSTRUCTION, IS_CANCELED", "Text contains stroke; explicitly noncancelled order"], ["RIS_ORDERDTL", "PRIORITY", "Select raw priority S"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported. Separately scan RIS_ORDER for stroke text; COPY only positive order IDs and cancellation flags. Join candidate orders to exam details; require S, active detail and noncancelled order.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions. Candidate flags live in mart.stroke_candidate_orders; clinical text remains at source.", "tables": ["dw.dim_modality", "dw.fact_exam", "mart.stroke_candidate_orders"], "formula": "Eligible: source clinical instruction LIKE '%stroke%', raw priority S, is_deleted IS FALSE, order is_canceled IS FALSE. Count capture > ordered_at + 30 min and COALESCE(first_final, final) > ordered_at + 30 min separately. Valid denominator: nonnegative, complete timestamp pair; missing/negative endpoints excluded. Exactly 30 min is not a breach.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_EXAMRESULT", "body": "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "stage": 0, "level": 0}, {"id": "s4", "title": "RIS_ORDERDTL", "body": "IMAGE_CAPTURED_ON", "stage": 0, "level": 0}, {"id": "s5", "title": "RIS_ORDER", "body": "CLINICAL_INSTRUCTION, IS_CANCELED", "stage": 0, "level": 0}, {"id": "s6", "title": "RIS_ORDERDTL", "body": "PRIORITY", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON\nimage_captured_at ← RIS_ORDERDTL.IMAGE_CAPTURED_ON\npriority_code ← RIS_ORDERDTL.PRIORITY\nis_deleted: Y → true; N → false", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "stroke", "title": "mart.stroke_candidate_orders", "body": "SAVED TABLE\norder_id ← RIS_ORDER.ORDER_ID\nis_canceled ← RIS_ORDER.IS_CANCELED\nOnly CLINICAL_INSTRUCTION contains stroke\nJoin fact by order_id", "stage": 2, "level": 1}, {"id": "widget", "title": "STAT stroke candidates: capture / first final >30 min", "body": "report_at = COALESCE(first_finalized_at, finalized_at)\ntat_min = seconds(report_at − ordered_at) / 60\nDuration statistics include only report_at ≥ ordered_at\ncapture_over30 = COUNT(image_captured_at > ordered_at + 30 min)\nfinal_over30 = COUNT(report_at > ordered_at + 30 min)\nOnly candidate order_id, priority_code = S, is_deleted = false, is_canceled = false", "stage": 3, "level": 2}], "edges": [["s0", "fact"], ["s1", "fact"], ["s3", "fact"], ["s4", "fact"], ["s5", "fact"], ["s6", "fact"], ["s2", "modality"], ["s0", "stroke"], ["s5", "stroke"], ["fact", "widget"], ["modality", "widget"], ["stroke", "widget"]]}, "note": "Text mentions can include history or suspected stroke; this is a candidate cohort, not a validated acute pathway or SLA. Counts are exam details and may overlap between intervals. This is historical completion time, not current pending age. Separate full-history order metadata is source-checked before use.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "Two endpoints, two separate counts", "headers": ["Candidate exam", "Order → capture", "Order → first final"], "before": [["Demo A", "10 min", "40 min"], ["Demo B", "35 min", "50 min"], ["Demo C", "Missing", "30 min"]], "after": [["Capture >30 min", "1 exam", "Demo B"], ["First final >30 min", "2 exams", "Demo A + B"]], "answer": "Exactly 30 minutes is not greater than 30. Missing capture is excluded, not treated as fast. One exam can appear in both counts; do not add them.", "bars": [["Capture >30 min", 1], ["First final >30 min", 2]], "unit": "exams"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/sqlserver/stroke_orders_page.sql", "code": "-- Bounded numeric PK range. Both result sets cover the same range.\n-- Clinical text is evaluated at source and never returned.\nSELECT COUNT_BIG(*) FROM dbo.RIS_ORDER WHERE ORDER_ID >= ? AND ORDER_ID \u003c= ?;\nSELECT ORDER_ID,\n       CASE IS_CANCELED WHEN 'Y' THEN 1 WHEN 'N' THEN 0 END AS is_canceled\nFROM dbo.RIS_ORDER\nWHERE ORDER_ID >= ? AND ORDER_ID \u003c= ?\n  AND CLINICAL_INSTRUCTION LIKE '%stroke%'\nORDER BY ORDER_ID;\n"}, {"path": "sql/postgres/03_stroke_candidates.sql", "code": "-- Supplementary prototype metadata only. No clinical text or patient identifiers.\nCREATE TABLE IF NOT EXISTS mart.stroke_candidate_orders (\n    order_id integer PRIMARY KEY,\n    is_canceled boolean\n);\nCREATE TABLE IF NOT EXISTS mart.stroke_candidate_load_audit (\n    singleton boolean PRIMARY KEY DEFAULT true CHECK (singleton),\n    source_database text NOT NULL,\n    rule text NOT NULL,\n    source_max_order_id integer,\n    examined_orders bigint NOT NULL,\n    candidate_orders bigint NOT NULL,\n    loaded_at timestamptz NOT NULL DEFAULT now()\n);\n"}, {"path": "sql/postgres/dashboard/stroke_summary.sql", "code": "-- Historical completed intervals, not a current pending queue or confirmed stroke cohort.\nSELECT count(*)::bigint AS eligible_exams,\n       count(DISTINCT f.order_id)::bigint AS eligible_orders,\n       count(*) FILTER (WHERE f.image_captured_at >= f.ordered_at)::bigint AS capture_valid,\n       count(*) FILTER (WHERE f.image_captured_at > f.ordered_at + interval '30 minutes')::bigint AS capture_over30,\n       count(*) FILTER (WHERE f.image_captured_at IS NULL)::bigint AS capture_missing,\n       count(*) FILTER (WHERE f.image_captured_at \u003c f.ordered_at)::bigint AS capture_invalid,\n       count(*) FILTER (WHERE COALESCE(f.first_finalized_at,f.finalized_at) >= f.ordered_at)::bigint AS final_valid,\n       count(*) FILTER (WHERE COALESCE(f.first_finalized_at,f.finalized_at) > f.ordered_at + interval '30 minutes')::bigint AS final_over30,\n       count(*) FILTER (WHERE COALESCE(f.first_finalized_at,f.finalized_at) IS NULL)::bigint AS final_missing,\n       count(*) FILTER (WHERE COALESCE(f.first_finalized_at,f.finalized_at) \u003c f.ordered_at)::bigint AS final_invalid\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nJOIN mart.stroke_candidate_orders s ON s.order_id = f.order_id\nWHERE {where} AND f.priority_code = 'S'\n  AND f.is_deleted IS FALSE AND s.is_canceled IS FALSE;\n"}]}, {"label": "Process Time daily stage comparison", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_EXAMRESULT", "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "Report time: use first finalization when present, otherwise finalization"], ["RIS_ORDERDTL", "IMAGE_CAPTURED_ON", "Time image capture was recorded; patient arrival is a separate event"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["mart.exam_timing"], "formula": "On exams with ordered_at ≤ image_captured_at ≤ report_at: daily mean hours of order→capture and capture→first finalization. Same complete samples for both phases; stacked sum equals mean order→first finalization.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_EXAMRESULT", "body": "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "stage": 0, "level": 0}, {"id": "s4", "title": "RIS_ORDERDTL", "body": "IMAGE_CAPTURED_ON", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON\nimage_captured_at ← RIS_ORDERDTL.IMAGE_CAPTURED_ON\npriority_code ← RIS_ORDERDTL.PRIORITY\nis_deleted: Y → true; N → false", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "timing", "title": "mart.exam_timing", "body": "VIEW · calculated when queried\nreport_at = COALESCE(first_finalized_at, finalized_at)\norder_to_capture_min = seconds(image_captured_at − ordered_at) / 60\ncapture_to_report_min = seconds(report_at − image_captured_at) / 60\norder_to_report_min = seconds(report_at − ordered_at) / 60\nEach missing/negative interval → NULL\nOnly is_deleted = false", "stage": 2, "level": 2}, {"id": "widget", "title": "Process Time daily stage comparison", "body": "Use rows with both order_to_capture_min and capture_to_report_min\norder_capture_mean_hours = AVG(order_to_capture_min) / 60\ncapture_report_mean_hours = AVG(capture_to_report_min) / 60\ntotal_mean_hours = AVG(order_to_report_min) / 60\ntotal_mean_hours = order_capture_mean_hours + capture_report_mean_hours\nGroup by Bangkok date(ordered_at)", "stage": 3, "level": 3}], "edges": [["s0", "fact"], ["s1", "fact"], ["s3", "fact"], ["s4", "fact"], ["s2", "modality"], ["fact", "timing"], ["timing", "widget"], ["modality", "widget"]]}, "note": "Selected order dates/type, is_deleted IS FALSE. Complete cohort differs from cards; means are additive only on this shared cohort. Elapsed time includes nights/weekends, not staff working time.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "One exam journey, three measured phases", "headers": ["Exam", "Order time", "Capture time", "First finalized report time"], "before": [["Demo A", "09:00", "09:05", "09:10"], ["Demo B", "09:00", "09:05", "09:20"], ["Demo C", "09:00", "09:05", "09:30"], ["Demo D", "09:00", "09:05", "09:40"], ["Demo E", "09:00", "09:05", "14:00"]], "after": [["Mean order → capture", "5 min", "All five share this phase"], ["Mean capture → report", "75 min", "5, 15, 25, 35, 295 min"], ["Mean order → report", "80 min", "5 + 75 on the same complete cohort"]], "answer": "Using the same five exams with all required times, phase means add to total mean. Total p50 = 30 min; p90 = 196 min using continuous interpolation. Four of five totals are ≤4 hours (80%); one is >4–24 hours (20%). Phase percentiles must not be added.", "bars": [["Mean order → capture", 5], ["Mean capture → report", 75], ["Mean order → report", 80]], "unit": "min"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/process_time_stages_daily.sql", "code": "-- Same complete, chronologically valid cohort for both stages; means are additive.\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       count(*)::bigint AS complete_samples,\n       avg(f.order_to_capture_min) / 60 AS order_capture_mean_hours,\n       avg(f.capture_to_report_min) / 60 AS capture_report_mean_hours,\n       avg(f.order_to_report_min) / 60 AS total_mean_hours\nFROM mart.exam_timing f\nWHERE {where}\n  AND f.order_to_capture_min IS NOT NULL\n  AND f.capture_to_report_min IS NOT NULL\nGROUP BY 1 ORDER BY 1;\n"}]}, {"label": "Process Time daily duration bands", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_EXAMRESULT", "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "Report time: use first finalization when present, otherwise finalization"], ["RIS_ORDERDTL", "IMAGE_CAPTURED_ON", "Time image capture was recorded; patient arrival is a separate event"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["mart.exam_timing"], "formula": "Per order day: count valid order→report intervals in ≤240, >240–1440, >1440–2880, >2880 minutes. Share = 100 × band count / valid interval count.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_EXAMRESULT", "body": "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "stage": 0, "level": 0}, {"id": "s4", "title": "RIS_ORDERDTL", "body": "IMAGE_CAPTURED_ON", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON\nimage_captured_at ← RIS_ORDERDTL.IMAGE_CAPTURED_ON\npriority_code ← RIS_ORDERDTL.PRIORITY\nis_deleted: Y → true; N → false", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "timing", "title": "mart.exam_timing", "body": "VIEW · calculated when queried\nreport_at = COALESCE(first_finalized_at, finalized_at)\norder_to_capture_min = seconds(image_captured_at − ordered_at) / 60\ncapture_to_report_min = seconds(report_at − image_captured_at) / 60\norder_to_report_min = seconds(report_at − ordered_at) / 60\nEach missing/negative interval → NULL\nOnly is_deleted = false", "stage": 2, "level": 2}, {"id": "widget", "title": "Process Time daily duration bands", "body": "valid_samples = COUNT(order_to_report_min IS NOT NULL)\nwithin_four_hours = COUNT(order_to_report_min ≤ 240)\nfour_to_24_hours = COUNT(240 \u003c order_to_report_min ≤ 1440)\nhours_24_to_48 = COUNT(1440 \u003c order_to_report_min ≤ 2880)\nover_48_hours = COUNT(order_to_report_min > 2880)\nDisplayed band share = 100 × band count / valid_samples\nGroup by Bangkok date(ordered_at)", "stage": 3, "level": 3}], "edges": [["s0", "fact"], ["s1", "fact"], ["s3", "fact"], ["s4", "fact"], ["s2", "modality"], ["fact", "timing"], ["timing", "widget"], ["modality", "widget"]]}, "note": "Bands partition valid finalized exams. Missing/negative totals are excluded; no completed exams gives no bar. These are descriptive bands, not confirmed SLA targets. Selected type/dates and active exam rules apply.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "One exam journey, three measured phases", "headers": ["Exam", "Order time", "Capture time", "First finalized report time"], "before": [["Demo A", "09:00", "09:05", "09:10"], ["Demo B", "09:00", "09:05", "09:20"], ["Demo C", "09:00", "09:05", "09:30"], ["Demo D", "09:00", "09:05", "09:40"], ["Demo E", "09:00", "09:05", "14:00"]], "after": [["Mean order → capture", "5 min", "All five share this phase"], ["Mean capture → report", "75 min", "5, 15, 25, 35, 295 min"], ["Mean order → report", "80 min", "5 + 75 on the same complete cohort"]], "answer": "Using the same five exams with all required times, phase means add to total mean. Total p50 = 30 min; p90 = 196 min using continuous interpolation. Four of five totals are ≤4 hours (80%); one is >4–24 hours (20%). Phase percentiles must not be added.", "bars": [["Mean order → capture", 5], ["Mean capture → report", 75], ["Mean order → report", 80]], "unit": "min"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/process_time_bands_daily.sql", "code": "-- Disjoint descriptive bands, not clinical SLA targets. Excludes invalid/missing totals.\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       count(*)::bigint AS valid_samples,\n       count(*) FILTER (WHERE f.order_to_report_min \u003c= 240)::bigint AS within_four_hours,\n       count(*) FILTER (WHERE f.order_to_report_min > 240 AND f.order_to_report_min \u003c= 1440)::bigint AS four_to_24_hours,\n       count(*) FILTER (WHERE f.order_to_report_min > 1440 AND f.order_to_report_min \u003c= 2880)::bigint AS hours_24_to_48,\n       count(*) FILTER (WHERE f.order_to_report_min > 2880)::bigint AS over_48_hours\nFROM mart.exam_timing f\nWHERE {where} AND f.order_to_report_min IS NOT NULL\nGROUP BY 1 ORDER BY 1;\n"}]}, {"label": "Process Time priority comparison", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_EXAMRESULT", "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "Report time: use first finalization when present, otherwise finalization"], ["RIS_ORDERDTL", "IMAGE_CAPTURED_ON", "Time image capture was recorded; patient a
