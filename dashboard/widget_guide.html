) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/modality_share.sql", "code": "-- Denominator includes ALL exam rows in the selected date/modality filter.\n-- Group by name, matching the dashboard's modality selector.\nWITH counts AS (\n    SELECT m.modality_name, count(*)::bigint AS exam_records\n    FROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\n    WHERE {where}\n    GROUP BY m.modality_name\n)\nSELECT modality_name, exam_records,\n       sum(exam_records) OVER ()::bigint AS selected_exam_records,\n       100.0 * exam_records / NULLIF(sum(exam_records) OVER (),0) AS share_pct\nFROM counts\nORDER BY exam_records DESC, modality_name;\n"}]}, {"label": "Source-to-target reconciliation", "family": "Validation", "status": "Implemented calculation", "sources": [["Source extraction + load audit", "Source/extracted/quarantined counts", "Coverage evidence collected during loading"]], "transform": "Compare completed extraction audit with current represented and quarantined target counts.", "storage": "dw.load_audit + dw.fact_exam + dw.fact_exam_unmapped; supplementary coverage comes from mart.integration_load_audit.", "tables": ["dw.load_audit"], "formula": "Source = represented target + quarantined. Compare current target counts and undated coverage with the load audit.", "flow": {"nodes": [{"id": "s0", "title": "Source extraction + load audit", "body": "Source/extracted/quarantined counts", "stage": 0, "level": 0}, {"id": "audit", "title": "dw.load_audit", "body": "SAVED TABLE · completed extract counts\nsource_exam_count, loaded_exam_count\nunmapped_exam_count, finished_at", "stage": 2, "level": 1}, {"id": "fact", "title": "dw.fact_exam + dw.fact_exam_unmapped", "body": "SAVED TABLES\nMapped exam rows + separately retained rows\nActual row counts checked against audit", "stage": 2, "level": 1}, {"id": "widget", "title": "Source-to-target reconciliation", "body": "source_records = source_exam_count from latest complete dw.load_audit\nloaded_records = loaded_exam_count\nstored_rows = COUNT(dw.fact_exam rows)\nexcluded_records = COUNT(dw.fact_exam_unmapped rows)\nCheck source_records = stored_rows + excluded_records\nCounts query uses one PostgreSQL snapshot; source was not a consistent snapshot", "stage": 3, "level": 2}], "edges": [["s0", "audit"], ["s0", "fact"], ["audit", "widget"], ["fact", "widget"]]}, "note": "Full-history check; does not prove value equality or source snapshot consistency.", "context": "Full-history load coverage; dashboard selection does not apply", "example": {"title": "Reconcile a completed load", "headers": ["Input", "Rows", "Disposition"], "before": [["Source extract", 6, "5 usable + 1 undated"]], "after": [["Serving fact", 5, "Included"], ["Quarantine", 1, "Retained separately"]], "answer": "6 source records = 5 represented + 1 quarantined. This checks coverage, not equality of every field or a frozen source snapshot.", "bars": [["Represented", 5], ["Quarantined", 1]], "unit": "rows"}, "codes": [{"path": "sql/postgres/dashboard/reconciliation_exam_counts.sql", "code": "-- A single statement observes the fact and quarantine in one PostgreSQL snapshot.\nSELECT 'exam'::text AS dataset,\n       count(*)::bigint AS stored_rows, count(*)::bigint AS represented_records,\n       (SELECT count(*)::bigint FROM dw.fact_exam_unmapped) AS excluded_records,\n       NULL::bigint AS undated_records\nFROM dw.fact_exam;\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/reconciliation_exam_audit.sql", "code": "SELECT 'exam'::text AS dataset, source_database,\n       source_exam_count AS source_records, loaded_exam_count AS loaded_records,\n       (to_jsonb(a)->>'unmapped_exam_count')::bigint AS excluded_records,\n       NULL::bigint AS undated_records, finished_at,\n       'Source count covers RIS_ORDERDTL joined to RIS_ORDER. NOLOCK extraction; count equality does not prove a consistent source snapshot.'::text AS consistency_note\nFROM dw.load_audit a\nWHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n"}]}, {"label": "Snapshot counters / Legacy TECHWORKS entry count", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME, IS_CANCELED", "Canceled order IDs (IS_CANCELED = Y) are loaded separately and excluded from RIS Snapshot"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_ORDERDTL", "IMAGE_CAPTURED_ON", "Time image capture was recorded; patient arrival is a separate event"], ["RIS_EXAMRESULT", "FIRSTFINALIZED_ON, FINALIZED_ON", "Count records with a report timestamp"], ["RIS_TECHWORKS", "ACCESSION_NO", "Number of recorded workflow entries; not a repeat-scan count"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["dw.fact_exam"], "formula": "Orders = COUNT(DISTINCT order_id); exams = COUNT(*); captured = count non-null capture; finalized = count non-null COALESCE(first_final, final); legacy multiple-entry metric = count technical_take_count > 1; this is not a repeat-scan count.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME, IS_CANCELED", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_ORDERDTL", "body": "IMAGE_CAPTURED_ON", "stage": 0, "level": 0}, {"id": "s4", "title": "RIS_EXAMRESULT", "body": "FIRSTFINALIZED_ON, FINALIZED_ON", "stage": 0, "level": 0}, {"id": "s5", "title": "RIS_TECHWORKS", "body": "ACCESSION_NO", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON\nimage_captured_at ← RIS_ORDERDTL.IMAGE_CAPTURED_ON\ntechnical_take_count = COUNT(RIS_TECHWORKS rows per accession)", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "canceled", "title": "mart.canceled_orders", "body": "SAVED TABLE · explicit canceled order IDs\norder_id ← RIS_ORDER.ORDER_ID where IS_CANCELED = Y\nExclude matching fact_exam.order_id\nAlso exclude fact_exam.is_deleted = true\nRaw fact rows remain stored", "stage": 2, "level": 1}, {"id": "widget", "title": "Snapshot counters / Legacy TECHWORKS entry count", "body": "orders = COUNT(DISTINCT order_id)\nexams = COUNT(exam rows)\ncaptured_exams = COUNT(image_captured_at IS NOT NULL)\nfinalized_exams = COUNT(COALESCE(first_finalized_at, finalized_at) IS NOT NULL)\nmultiple_takes = COUNT(technical_take_count > 1)\nmultiple_takes is a legacy SQL name for multiple workflow entries", "stage": 3, "level": 2}], "edges": [["s0", "fact"], ["s1", "fact"], ["s3", "fact"], ["s4", "fact"], ["s5", "fact"], ["s2", "modality"], ["s0", "canceled"], ["fact", "widget"], ["modality", "widget"], ["canceled", "widget"]]}, "note": "RIS Snapshot excludes canceled orders and deleted exam details; unknown flags are retained. Timestamp presence does not validate an interval. Counts are exam details, not patients or images.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "One order can contain multiple exams", "headers": ["Order", "Exam", "Modality"], "before": [["Demo 1", "Exam A", "CT"], ["Demo 1", "Exam B", "MRI"], ["Demo 2", "Exam C", "CT"]], "after": [["All", "2 distinct orders", "3 exam details"], ["CT", "2 exam details", "66.7% of exams"], ["MRI", "1 exam detail", "33.3% of exams"]], "answer": "Order count = 2; exam count = 3. Modality shares use exam details. Per-modality distinct-order counts can overlap.", "bars": [["CT exam records", 2], ["MRI exam records", 1]], "unit": "exams"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/summary.sql", "code": "SELECT count(DISTINCT f.order_id)::bigint AS orders,\n       count(*)::bigint AS exams,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_exams,\n       count(*) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL)::bigint AS finalized_exams,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_takes\nFROM dw.fact_exam f\nWHERE {where};\n"}]}, {"label": "Daily exam records / Median TAT / TAT Outliers", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_EXAMRESULT", "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "Report time: use first finalization when present, otherwise finalization"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["dw.dim_modality", "dw.fact_exam"], "formula": "Daily order-date count; p50 of valid (COALESCE(first_final, final) − ordered_at)/60 seconds; outlier count where report > order + 4 hours.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_EXAMRESULT", "body": "ACCESSION_NO, FIRSTFINALIZED_ON, FINALIZED_ON", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time\nfirst_finalized_at ← RIS_EXAMRESULT.FIRSTFINALIZED_ON\nfinalized_at ← RIS_EXAMRESULT.FINALIZED_ON", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "widget", "title": "Daily exam records / Median TAT / TAT Outliers", "body": "report_at = COALESCE(first_finalized_at, finalized_at)\ntat_min = seconds(report_at − ordered_at) / 60\nDuration statistics include only report_at ≥ ordered_at\norders = COUNT(DISTINCT order_id)\nexams = COUNT(exam rows, including untimed exams)\nmedian_tat_min = percentile(tat_min, 50%)\noutliers = COUNT(tat_min > 240)\nGroup by order_date = Bangkok date(ordered_at)", "stage": 3, "level": 2}], "edges": [["s0", "fact"], ["s1", "fact"], ["s3", "fact"], ["s2", "modality"], ["fact", "widget"], ["modality", "widget"]]}, "note": "Includes deleted/unknown rows and all priorities. Missing/negative durations excluded. Exactly 240 minutes is not an outlier.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "Start and end times → elapsed minutes → daily summary", "headers": ["Exam", "Order time", "Report time used"], "before": [["Demo A", "09:00", "09:10"], ["Demo B", "09:00", "09:20"], ["Demo C", "09:00", "09:30"], ["Demo D", "09:00", "09:40"], ["Demo E", "09:00", "14:00"], ["Demo F", "09:00", "Missing"]], "after": [["Durations included in the calculation", "10, 20, 30, 40, 300 min", "Missing report excluded from timing"], ["Mean / median", "80 min / 30 min", "400 / 5 versus middle value"], [">4h / IQR outliers", "1 / 1 exam", "Q1=20, Q3=40; upper fence=70 min"]], "answer": "Six exam records, but five calculable durations. Median = 30 min; mean = 80 min. Normal IQR group mean = 25 min; high-outlier mean = 300 min. These illustrate timing math; phase and deletion rules depend on the selected widget.", "bars": [["Mean", 80], ["Median", 30], ["High-outlier mean", 300]], "unit": "min"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/daily.sql", "code": "SELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       count(DISTINCT f.order_id)::bigint AS orders,\n       count(*)::bigint AS exams,\n       count(*) FILTER (WHERE COALESCE(f.first_finalized_at,f.finalized_at) >\n                             f.ordered_at + interval '4 hours')::bigint AS outliers,\n       percentile_cont(0.5) WITHIN GROUP (\n         ORDER BY EXTRACT(EPOCH FROM\n           (COALESCE(f.first_finalized_at,f.finalized_at)-f.ordered_at))/60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at,f.finalized_at) >= f.ordered_at)\n         AS median_tat_min\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nWHERE {where} GROUP BY 1 ORDER BY 1;\n"}]}, {"label": "Top exam definitions", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME, IS_CANCELED", "Canceled order IDs (IS_CANCELED = Y) are loaded separately and excluded from RIS Snapshot"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"], ["RIS_EXAM", "EXAM_ID, EXAM_NAME", "Exam names used in chart groups"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["dw.dim_exam", "dw.dim_modality", "dw.fact_exam"], "formula": "COUNT(*) by exam name; largest ten.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME, IS_CANCELED", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "s3", "title": "RIS_EXAM", "body": "EXAM_ID, EXAM_NAME", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "exam", "title": "dw.dim_exam", "body": "SAVED TABLE\nexam_id ← EXAM_ID\nexam_name ← EXAM_NAME\nJoin fact by exam_id", "stage": 2, "level": 1}, {"id": "canceled", "title": "mart.canceled_orders", "body": "SAVED TABLE · explicit canceled order IDs\norder_id ← RIS_ORDER.ORDER_ID where IS_CANCELED = Y\nExclude matching fact_exam.order_id\nAlso exclude fact_exam.is_deleted = true\nRaw fact rows remain stored", "stage": 2, "level": 1}, {"id": "widget", "title": "Top exam definitions", "body": "\"Exam records\" = COUNT(exam rows) per exam_name\nSort descending; show largest 10", "stage": 3, "level": 2}], "edges": [["s0", "fact"], ["s1", "fact"], ["s2", "modality"], ["s3", "exam"], ["s0", "canceled"], ["fact", "widget"], ["modality", "widget"], ["exam", "widget"], ["canceled", "widget"]]}, "note": "Identically named exam IDs combine. RIS Snapshot excludes canceled orders and deleted exam details; unknown flags are retained.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "One order can contain multiple exams", "headers": ["Order", "Exam", "Modality"], "before": [["Demo 1", "Exam A", "CT"], ["Demo 1", "Exam B", "MRI"], ["Demo 2", "Exam C", "CT"]], "after": [["All", "2 distinct orders", "3 exam details"], ["CT", "2 exam details", "66.7% of exams"], ["MRI", "1 exam detail", "33.3% of exams"]], "answer": "Order count = 2; exam count = 3. Modality shares use exam details. Per-modality distinct-order counts can overlap.", "bars": [["CT exam records", 2], ["MRI exam records", 1]], "unit": "exams"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/top_exams.sql", "code": "SELECT e.exam_name AS \"Exam\", count(*)::bigint AS \"Exam records\"\nFROM dw.fact_exam f\nJOIN dw.dim_exam e USING (exam_id)\nJOIN dw.dim_modality m USING (modality_id)\nWHERE {where}\nGROUP BY e.exam_name\nORDER BY \"Exam records\" DESC, e.exam_name\nLIMIT 10;\n"}]}, {"label": "Orders by Modality", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order ID and the time the order started"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "One exam within an order; accession links matching source records"], ["RIS_MODALITY → RIS_MODALITYTYPE", "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "Scanner names and modality types used for filtering"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions.", "tables": ["dw.dim_modality", "dw.fact_exam"], "formula": "COUNT(DISTINCT order_id) within each modality name; largest ten.", "flow": {"nodes": [{"id": "s0", "title": "RIS_ORDER", "body": "ORDER_ID, ORDER_START_TIME", "stage": 0, "level": 0}, {"id": "s1", "title": "RIS_ORDERDTL", "body": "ORDER_ID, EXAM_ID, MODALITY_ID, ACCESSION_NO, IS_DELETED", "stage": 0, "level": 0}, {"id": "s2", "title": "RIS_MODALITY → RIS_MODALITYTYPE", "body": "MODALITY_ID, MODALITY_NAME, MODALITY_TYPE → TYPE_ID, TYPE_NAME", "stage": 0, "level": 0}, {"id": "fact", "title": "dw.fact_exam", "body": "SAVED TIMESCALE TABLE · one exam detail\norder_id / exam_id ← RIS_ORDERDTL keys\nordered_at ← RIS_ORDER.ORDER_START_TIME\nmodality_id ← RIS_ORDERDTL.MODALITY_ID\nTimes interpreted as Bangkok time", "stage": 2, "level": 1}, {"id": "modality", "title": "dw.dim_modality", "body": "SAVED TABLE\nmodality_id ← MODALITY_ID\nmodality_name ← MODALITY_NAME\nmodality_type ← MODALITY_TYPE\nmodality_type_name ← TYPE_NAME\nJoin fact by modality_id", "stage": 2, "level": 1}, {"id": "widget", "title": "Orders by Modality", "body": "order_count = COUNT(DISTINCT order_id) per modality_name\nSort descending; show largest 10", "stage": 3, "level": 2}], "edges": [["s0", "fact"], ["s1", "fact"], ["s2", "modality"], ["fact", "widget"], ["modality", "widget"]]}, "note": "One order can appear in multiple modalities; bar totals can exceed overall distinct orders.", "context": "Selected Bangkok ORDER dates and modality type", "example": {"title": "One order can contain multiple exams", "headers": ["Order", "Exam", "Modality"], "before": [["Demo 1", "Exam A", "CT"], ["Demo 1", "Exam B", "MRI"], ["Demo 2", "Exam C", "CT"]], "after": [["All", "2 distinct orders", "3 exam details"], ["CT", "2 exam details", "66.7% of exams"], ["MRI", "1 exam detail", "33.3% of exams"]], "answer": "Order count = 2; exam count = 3. Modality shares use exam details. Per-modality distinct-order counts can overlap.", "bars": [["CT exam records", 2], ["MRI exam records", 1]], "unit": "exams"}, "codes": [{"path": "sql/sqlserver/fact_exam_extract.sql", "code": "-- Keyset page: size, last order (twice), last exam, fixed maximum order.\n-- Repeat pages through the entire history; these are key bounds, not date filters.\nSELECT TOP (?) o.ORDER_START_TIME, d.ORDER_ID, d.EXAM_ID, d.MODALITY_ID,\n       CASE WHEN h.EMP_ID IS NOT NULL THEN h.EMP_ID END AS RADIOLOGIST_ID,\n       d.PRIORITY, d.STATUS, r.RESULT_STATUS,\n       d.EXAM_DT, o.ARRIVAL_ON, d.IMAGE_CAPTURED_ON, d.QA_ON,\n       r.FIRSTFINALIZED_ON, r.FINALIZED_ON, r.RELEASED_ON,\n       COALESCE(t.take_count, 0),\n       d.LAST_MODIFIED_ON,\n       CASE d.IS_DELETED WHEN 'Y' THEN 'true' WHEN 'N' THEN 'false' END AS IS_DELETED\nFROM dbo.RIS_ORDERDTL d WITH (NOLOCK)\nJOIN dbo.RIS_ORDER o WITH (NOLOCK) ON o.ORDER_ID = d.ORDER_ID\nLEFT JOIN dbo.RIS_EXAMRESULT r WITH (NOLOCK)\n  ON r.ACCESSION_NO = d.ACCESSION_NO\nLEFT JOIN dbo.HR_EMP h WITH (NOLOCK)\n  ON h.EMP_ID = r.FINALIZED_BY AND h.IS_RADIOLOGIST = 'Y'\nOUTER APPLY (\n  SELECT COUNT_BIG(*) AS take_count\n  FROM dbo.RIS_TECHWORKS tw WITH (NOLOCK)\n  WHERE tw.ACCESSION_NO = d.ACCESSION_NO\n) t\nWHERE d.ORDER_ID >= ? AND (d.ORDER_ID > ? OR d.EXAM_ID > ?)\n  AND d.ORDER_ID \u003c= ?\nORDER BY d.ORDER_ID, d.EXAM_ID\nOPTION (RECOMPILE);\n"}, {"path": "sql/postgres/load/copy_fact.sql", "code": "-- PostgreSQL text COPY. Python escapes backslash, tab, newline, and carriage return;\n-- unquoted \\N represents SQL NULL. The column order matches the SQL Server extract.\nCOPY dw.fact_exam (\n    ordered_at, order_id, exam_id, modality_id, radiologist_id,\n    priority_code, exam_status_code, result_status_code, exam_at,\n    arrival_at, image_captured_at, qa_at, first_finalized_at,\n    finalized_at, released_at, technical_take_count, source_modified_at,\n    is_deleted\n) FROM STDIN WITH (FORMAT text, DELIMITER E'\\t', NULL '\\N');\n"}, {"path": "sql/postgres/01_schema.sql", "code": "-- PROTOTYPE ONLY. All source times are interpreted as Asia/Bangkok local time.\nCREATE EXTENSION IF NOT EXISTS timescaledb;\nCREATE SCHEMA IF NOT EXISTS dw;\nCREATE SCHEMA IF NOT EXISTS mart;\n\nCREATE TABLE IF NOT EXISTS dw.dim_modality (\n    modality_id integer PRIMARY KEY,\n    modality_name text NOT NULL,\n    modality_type integer,\n    modality_type_name text,\n    is_active text\n);\n\n-- Additive upgrade for existing prototype databases; populated by dimension load.\nALTER TABLE dw.dim_modality ADD COLUMN IF NOT EXISTS modality_type_name text;\n\nCREATE TABLE IF NOT EXISTS dw.dim_exam (\n    exam_id integer PRIMARY KEY,\n    exam_name text NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS dw.dim_radiologist (\n    employee_id integer PRIMARY KEY,\n    display_name text NOT NULL\n);\n\n-- Grain: one RIS_ORDERDTL (ORDER_ID, EXAM_ID), located on its order date.\n-- No patient identifier, accession number, or report content is copied.\nCREATE TABLE IF NOT EXISTS dw.fact_exam (\n    ordered_at timestamptz NOT NULL,\n    order_id integer NOT NULL,\n    exam_id integer NOT NULL REFERENCES dw.dim_exam(exam_id),\n    modality_id integer NOT NULL REFERENCES dw.dim_modality(modality_id),\n    radiologist_id integer REFERENCES dw.dim_radiologist(employee_id),\n    priority_code text,\n    exam_status_code text,\n    result_status_code text,\n    exam_at timestamptz,\n    arrival_at timestamptz,\n    image_captured_at timestamptz,\n    qa_at timestamptz,\n    first_finalized_at timestamptz,\n    finalized_at timestamptz,\n    released_at timestamptz,\n    technical_take_count integer NOT NULL DEFAULT 0,\n    source_modified_at timestamptz,\n    is_deleted boolean,\n    loaded_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (ordered_at, order_id, exam_id)\n);\n-- Expand existing prototype databases before the transactional fact refresh.\nALTER TABLE dw.fact_exam ADD COLUMN IF NOT EXISTS is_deleted boolean;\nSELECT create_hypertable('dw.fact_exam', 'ordered_at', if_not_exists => TRUE);\nCREATE INDEX IF NOT EXISTS fact_exam_modality_time ON dw.fact_exam (modality_id, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_priority_time ON dw.fact_exam (priority_code, ordered_at DESC);\nCREATE INDEX IF NOT EXISTS fact_exam_radiologist_time ON dw.fact_exam (radiologist_id, ordered_at DESC);\n\n-- Preserve extracted rows that cannot enter the time-partitioned star.\n-- No surrogate dates or dimension IDs are invented. These rows are excluded from marts.\nCREATE TABLE IF NOT EXISTS dw.fact_exam_unmapped (LIKE dw.fact_exam INCLUDING DEFAULTS);\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN ordered_at DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN order_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN exam_id DROP NOT NULL;\nALTER TABLE dw.fact_exam_unmapped ALTER COLUMN modality_id DROP NOT NULL;\n\n-- One row per active exam. Invalid or missing timestamp pairs produce NULL durations.\nCREATE OR REPLACE VIEW mart.exam_timing AS\nSELECT f.ordered_at, f.order_id, f.exam_id, f.modality_id, f.priority_code,\n       f.image_captured_at, r.report_at,\n       CASE WHEN f.image_captured_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM f.image_captured_at - f.ordered_at) / 60 END AS order_to_capture_min,\n       CASE WHEN r.report_at >= f.image_captured_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.image_captured_at) / 60 END AS capture_to_report_min,\n       CASE WHEN r.report_at >= f.ordered_at\n            THEN EXTRACT(EPOCH FROM r.report_at - f.ordered_at) / 60 END AS order_to_report_min,\n       (f.image_captured_at \u003c f.ordered_at) AS capture_before_order,\n       (r.report_at \u003c f.image_captured_at) AS report_before_capture,\n       (r.report_at \u003c f.ordered_at) AS report_before_order\nFROM dw.fact_exam f\nCROSS JOIN LATERAL (VALUES (COALESCE(f.first_finalized_at, f.finalized_at))) r(report_at)\nWHERE f.is_deleted IS FALSE;\n\nCREATE TABLE IF NOT EXISTS dw.load_audit (\n    load_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    started_at timestamptz NOT NULL DEFAULT now(),\n    finished_at timestamptz,\n    source_database text NOT NULL,\n    source_exam_count bigint,\n    loaded_exam_count bigint,\n    source_max_order_at timestamptz,\n    source_max_result_at timestamptz,\n    status text NOT NULL,\n    notes text\n);\nALTER TABLE dw.load_audit ADD COLUMN IF NOT EXISTS unmapped_exam_count bigint NOT NULL DEFAULT 0;\n\n-- Materialized marts are refreshed after each completed extract.\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.exam_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       f.modality_id, f.priority_code,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.image_captured_at IS NOT NULL)::bigint AS captured_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NOT NULL OR f.finalized_at IS NOT NULL)::bigint AS finalized_count,\n       count(*) FILTER (WHERE f.first_finalized_at IS NULL AND f.finalized_at IS NULL)::bigint AS unfinalized_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS repeat_take_count,\n       count(*) FILTER (WHERE f.arrival_at IS NOT NULL)::bigint AS arrival_timestamp_count,\n       percentile_cont(0.5) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM (COALESCE(f.first_finalized_at, f.finalized_at) - f.ordered_at)) / 60\n       ) FILTER (WHERE COALESCE(f.first_finalized_at, f.finalized_at) >= f.ordered_at) AS median_order_to_first_final_min,\n       count(*) FILTER (\n           WHERE COALESCE(f.first_finalized_at, f.finalized_at) > f.ordered_at + interval '4 hours'\n       )::bigint AS over_four_hours_count\nFROM dw.fact_exam f\nGROUP BY 1, 2, 3\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS exam_daily_date_modality ON mart.exam_daily (order_date, modality_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS mart.producer_daily AS\nSELECT (COALESCE(f.first_finalized_at, f.finalized_at) AT TIME ZONE 'Asia/Bangkok')::date AS report_date,\n       f.radiologist_id,\n       count(*)::bigint AS finalized_reports\nFROM dw.fact_exam f\nWHERE f.radiologist_id IS NOT NULL\n  AND COALESCE(f.first_finalized_at, f.finalized_at) IS NOT NULL\nGROUP BY 1, 2\nWITH NO DATA;\nCREATE INDEX IF NOT EXISTS producer_daily_date ON mart.producer_daily (report_date, radiologist_id);\n\nCREATE OR REPLACE VIEW mart.source_freshness AS\nSELECT finished_at AS extracted_at, source_exam_count, loaded_exam_count,\n       source_max_order_at, source_max_result_at,\n       (now() - source_max_order_at) AS order_data_age,\n       (now() - source_max_result_at) AS result_data_age\nFROM dw.load_audit WHERE status = 'complete'\nORDER BY load_id DESC LIMIT 1;\n\nCREATE OR REPLACE VIEW mart.daily_workload AS\nSELECT d.order_date, m.modality_name, d.priority_code,\n       d.exam_count, d.captured_count, d.finalized_count,\n       d.unfinalized_count, d.repeat_take_count,\n       d.median_order_to_first_final_min, d.over_four_hours_count\nFROM mart.exam_daily d\nJOIN dw.dim_modality m USING (modality_id);\n\n-- This is a candidate work queue, not a verified RIS \"unread\" state.\nCREATE OR REPLACE VIEW mart.captured_unfinalized_queue AS\nSELECT m.modality_name, f.priority_code, count(*)::bigint AS exam_count,\n       min(f.image_captured_at) AS oldest_capture_at\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nWHERE f.image_captured_at IS NOT NULL\n  AND f.first_finalized_at IS NULL AND f.finalized_at IS NULL\nGROUP BY m.modality_name, f.priority_code;\n\nCREATE OR REPLACE VIEW mart.top_producers AS\nSELECT r.employee_id, r.display_name,\n       sum(p.finalized_reports)::bigint AS finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id\nGROUP BY r.employee_id, r.display_name;\n\nCREATE OR REPLACE VIEW mart.top_producers_daily AS\nSELECT p.report_date, r.employee_id, r.display_name, p.finalized_reports\nFROM mart.producer_daily p\nJOIN dw.dim_radiologist r ON r.employee_id = p.radiologist_id;\n\nCREATE OR REPLACE VIEW mart.tat_outliers_daily AS\nSELECT order_date, sum(over_four_hours_count)::bigint AS over_four_hours_count\nFROM mart.exam_daily GROUP BY order_date;\n\nCREATE OR REPLACE VIEW mart.repeat_takes_by_modality AS\nSELECT m.modality_name,\n       count(*)::bigint AS exam_count,\n       count(*) FILTER (WHERE f.technical_take_count > 1)::bigint AS multiple_take_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_name;\n\n-- An order can contain multiple exams and can appear in more than one modality.\nCREATE OR REPLACE VIEW mart.orders_by_modality_daily AS\nSELECT (f.ordered_at AT TIME ZONE 'Asia/Bangkok')::date AS order_date,\n       m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY 1, 2, 3;\n\nCREATE OR REPLACE VIEW mart.orders_by_modality AS\nSELECT m.modality_id, m.modality_name,\n       count(DISTINCT f.order_id)::bigint AS order_count,\n       count(*)::bigint AS exam_count\nFROM dw.fact_exam f\nJOIN dw.dim_modality m USING (modality_id)\nGROUP BY m.modality_id, m.modality_name;\n"}, {"path": "sql/postgres/dashboard/orders_by_modality_top10.sql", "code": "SELECT m.modality_name, count(DISTINCT f.order_id)::bigint AS order_count\nFROM dw.fact_exam f JOIN dw.dim_modality m USING (modality_id)\nWHERE {where} GROUP BY 1 ORDER BY order_count DESC LIMIT 10;\n"}]}, {"label": "Top Producers", "family": "Exam", "status": "Implemented calculation", "sources": [["RIS_ORDER", "ORDER_ID, ORDER_START_TIME", "Order row joined while loading the exam fact"], ["RIS_ORDERDTL", "ORDER_ID, EXAM_ID, ACCESSION_NO", "Exam detail matched to result"], ["RIS_EXAMRESULT", "FIRSTFINALIZED_ON, FINALIZED_ON, FINALIZED_BY", "Report date and finalizing provider"], ["HR_EMP", "EMP_ID, IS_RADIOLOGIST, names", "Resolve matched radiologist and display name"]], "transform": "Join one order detail to its order and result. Interpret SQL Server timestamps as Bangkok time. COPY exam fields into the Timescale fact; UPSERT dimensions. Accession is used for joins, not exported.", "storage": "dw.fact_exam: one exam detail, key (ordered_at, order_id, exam_id). Device/type and exam/provider labels live in dimensions. Reports are pre-counted by report date/provider in mart.producer_daily, then exposed through mart.top_producers_daily.", "tables": ["mart.top_producers_daily"], "formula": "SUM(finalized_reports) by display_name over report_date; larges
